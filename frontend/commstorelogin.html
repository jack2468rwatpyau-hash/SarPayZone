<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commission Store Login - Sar Pay Zone</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="gate-overlay">
        <div class="gate-box" style="max-width: 400px;">
                        <div><img src="partnerLogo.png" alt="partner logo" width="200"></div>
            <div class="logos-slot"><i class="fas fa-percentage"></i></div>
            <h2>Commission Store Portal</h2>
            
            <input type="tel" id="login-phone" placeholder="Phone Number" style="margin-bottom: 12px;">
            <input type="password" id="login-password" placeholder="Password" style="margin-bottom: 16px;">
            
            <button onclick="login('commission_store')" class="btn-primary">Login as Commission Store</button>
            <p id="login-error" class="error-text"></p>
        </div>
    </div>

    <script>
        const API_URL = 'https://sarpayzone-production.up.railway.app/api';
        
        async function login(role) {
            const phone = document.getElementById('login-phone').value;
            const password = document.getElementById('login-password').value;
            
            try {
                const res = await fetch(`${API_URL}/auth/seller/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password, role })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('spz_store_token', data.token);
                    window.location.href = '/store-dashboard.html';
                } else {
                    document.getElementById('login-error').textContent = data.error;
                }
            } catch (err) {
                document.getElementById('login-error').textContent = 'Login failed';
            }
        }
    </script>
</body>
</html>
