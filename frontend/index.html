<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sar Pay Zone - စာပေဇုန်</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Myanmar:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Password Code Gate -->
    <div id="password-gate" class="gate-overlay">
        <div class="gate-box">
            <div class="logo-slot">
                <img src="/assets/logo.png" alt="Sar Pay Zone" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'" width="200">
                <div class="logo-fallback" style="display:none;"><i class="fas fa-book-open"></i></div>
            </div>
            <h2>ဆိုင်သို့ ဝင်ရောက်ရန်</h2>
            <p class="gate-subtitle">ဆိုင်စာမျက်နှာတွင် ပြသထားသော ၆ လုံး Password Code ကို ထည့်ပါ</p>
            <input type="password" id="password-code" placeholder="၆ လုံးကုဒ်" maxlength="6" inputmode="numeric" pattern="[0-9]{6}">
            <button onclick="checkPasswordCode()" class="btn-primary">ဆိုင်ထဲသို့ ဝင်မည်</button>
            <p id="gate-error" class="error-text"></p>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal hidden">
        <div class="modal-content">
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchAuthTab('login')">Login</button>
                <button class="auth-tab" onclick="switchAuthTab('register')">Register</button>
            </div>
            <div id="auth-login">
                <input type="tel" id="login-phone" placeholder="Phone Number" maxlength="15">
                <input type="password" id="login-password" placeholder="Password" minlength="8">
                <button onclick="login()" class="btn-primary">Login</button>
            </div>
            <div id="auth-register" class="hidden">
                <input type="text" id="reg-name" placeholder="Full Name" maxlength="100">
                <input type="tel" id="reg-phone" placeholder="Phone Number" maxlength="15">
                <input type="password" id="reg-password" placeholder="Password (min 8 chars)" minlength="8">
                <input type="text" id="reg-city" placeholder="City (optional)">
                <button onclick="register()" class="btn-primary">Create Account</button>
            </div>
            <p id="auth-error" class="error-text"></p>
        </div>
    </div>

    <div id="checkout-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="checkout-title">
        <div class="modal-content checkout-form-card">
            <div class="modal-header"><div><p class="eyebrow">ပို့ဆောင်ရန်လိပ်စာ</p><h2 id="checkout-title">အော်ဒါတင်ရန် အချက်အလက်</h2></div><button class="icon-btn" onclick="closeCheckoutModal()" aria-label="ပိတ်ရန်"><i class="fas fa-times"></i></button></div>
            <p class="small text-secondary checkout-note">ပို့ခမှန်ကန်စေရန် ပစ္စည်းလက်ခံမည့် ပြည်နယ်၊ ခရိုင်နှင့် မြို့နယ်ကို ရွေးချယ်ပါ။</p>
            <div class="form-group"><label for="checkout-state">တိုင်းဒေသကြီး / ပြည်နယ်</label><select id="checkout-state"><option value="">ရွေးချယ်ပါ</option><option value="Yangon">ရန်ကုန်တိုင်းဒေသကြီး (Yangon)</option><option value="Mandalay">မန္တလေးတိုင်းဒေသကြီး (Mandalay)</option><option value="Naypyitaw">နေပြည်တော် (Naypyitaw)</option><option value="Bago">ပဲခူးတိုင်းဒေသကြီး (Bago)</option><option value="Sagaing">စစ်ကိုင်းတိုင်းဒေသကြီး (Sagaing)</option><option value="Magway">မကွေးတိုင်းဒေသကြီး (Magway)</option><option value="Shan">ရှမ်းပြည်နယ် (Shan)</option><option value="Mon">မွန်ပြည်နယ် (Mon)</option><option value="Kayin">ကရင်ပြည်နယ် (Kayin)</option><option value="Kachin">ကချင်ပြည်နယ် (Kachin)</option><option value="Kayah">ကယားပြည်နယ် (Kayah)</option><option value="Chin">ချင်းပြည်နယ် (Chin)</option><option value="Rakhine">ရခိုင်ပြည်နယ် (Rakhine)</option><option value="Tanintharyi">တနင်္သာရီတိုင်းဒေသကြီး (Tanintharyi)</option><option value="Ayeyarwady">ဧရာဝတီတိုင်းဒေသကြီး (Ayeyarwady)</option></select></div>
            <div class="form-group"><label for="checkout-district">ခရိုင်</label><input id="checkout-district" maxlength="80" placeholder="ဥပမာ - Kamayut / အင်းစိန်"></div>
            <div class="form-group"><label for="checkout-township">မြို့နယ်</label><input id="checkout-township" maxlength="80" placeholder="ဥပမာ - Kamayut / ကမာရွတ်"></div>
            <div class="form-group"><label for="checkout-address">အသေးစိတ်လိပ်စာ</label><textarea id="checkout-address" maxlength="500" placeholder="အိမ်အမှတ်၊ လမ်း၊ ရပ်ကွက်၊ ဆက်သွယ်ရန်ဖုန်းနံပါတ်"></textarea></div>
            <div class="form-group"><label for="checkout-payment">ငွေပေးချေမှုနည်းလမ်း</label><select id="checkout-payment"><option value="wallet">Wallet ဖြင့်ပေးချေမည်</option><option value="cod">ပစ္စည်းရောက်မှ ငွေချေမည် (COD)</option></select></div>
            <p id="checkout-error" class="error-text"></p><button onclick="submitCheckout()" class="btn-primary">အော်ဒါတင်မည်</button>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="hidden">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-slot-header">
                <img src="/assets/logo.png" alt="SPZ" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                <div class="logo-fallback" style="display:none;"><i class="fas fa-book-open"></i></div>
            </div>
            <div class="header-actions">
                <button onclick="navigateTo('search')" class="icon-btn"><i class="fas fa-search"></i></button>
                <button onclick="navigateTo('cart')" class="icon-btn"><i class="fas fa-shopping-bag"></i></button>
            </div>
        </header>

        <!-- Content Area -->
        <main id="main-content" class="main-content"></main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button onclick="navigateTo('home')" class="nav-item active" data-page="home">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </button>
            <button onclick="navigateTo('categories')" class="nav-item" data-page="categories">
                <i class="fas fa-th-large"></i>
                <span>Categories</span>
            </button>
            <button onclick="navigateTo('chat')" class="nav-item" data-page="chat">
                <i class="fas fa-comment-dots"></i>
                <span>Chat</span>
            </button>
            <button onclick="navigateTo('profile')" class="nav-item" data-page="profile">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </button>
        </nav>
    </div>

    <!-- Product Detail Modal -->
    <div id="product-modal" class="modal hidden">
        <div class="modal-content product-modal-content">
            <button onclick="closeModal('product-modal')" class="close-btn"><i class="fas fa-times"></i></button>
            <div id="product-detail-content"></div>
        </div>
    </div>

    <script>
        // ===== STATE MANAGEMENT =====
        const API_URL = 'https://sarpayzone-production.up.railway.app/api';
        let currentUser = null;
        let authToken = localStorage.getItem('spz_token');
        let currentPage = 'home';
        let cart = JSON.parse(localStorage.getItem('spz_cart') || '[]');

        // ===== PASSWORD GATE =====
        async function checkPasswordCode() {
            const code = document.getElementById('password-code').value;
            try {
                const res = await fetch(`${API_URL}/auth/buyer/check-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password_code: code })
                });
                if (res.ok) {
                    document.getElementById('password-gate').classList.add('hidden');
                    if (authToken) {
                        await loadUser();
                        showApp();
                    } else {
                        showAuthModal();
                    }
                } else {
                    document.getElementById('gate-error').textContent = 'Invalid access code';
                }
            } catch (err) {
                document.getElementById('gate-error').textContent = 'Connection error';
            }
        }

        // ===== AUTH =====
        function showAuthModal() {
            document.getElementById('auth-modal').classList.remove('hidden');
        }

        function switchAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.auth-tab:nth-child(${tab === 'login' ? 1 : 2})`)?.classList.add('active');
            document.getElementById('auth-login').classList.toggle('hidden', tab !== 'login');
            document.getElementById('auth-register').classList.toggle('hidden', tab !== 'register');
        }

        async function login() {
            const phone = document.getElementById('login-phone').value;
            const password = document.getElementById('login-password').value;
            try {
                const res = await fetch(`${API_URL}/auth/buyer/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });
                const data = await res.json();
                if (res.ok) {
                    authToken = data.token;
                    localStorage.setItem('spz_token', authToken);
                    currentUser = data.user;
                    showApp();
                } else {
                    document.getElementById('auth-error').textContent = data.error;
                }
            } catch (err) {
                document.getElementById('auth-error').textContent = 'Login failed';
            }
        }

        async function register() {
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const password = document.getElementById('reg-password').value;
            const city = document.getElementById('reg-city').value;
            try {
                const res = await fetch(`${API_URL}/auth/buyer/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, password, city })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('Registration successful! Please login.');
                    switchAuthTab('login');
                } else {
                    document.getElementById('auth-error').textContent = data.error;
                }
            } catch (err) {
                document.getElementById('auth-error').textContent = 'Registration failed';
            }
        }

        async function loadUser() {
            const res = await fetch(`${API_URL}/auth/me`, {
                headers: { 'Authorization': `Bearer ${authToken}` }
            });
            if (res.ok) {
                const data = await res.json();
                currentUser = data.user;
            } else {
                localStorage.removeItem('spz_token');
                authToken = null;
            }
        }

        function showApp() {
            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            requestPushPermission();
            navigateTo('home');
        }

        // ===== ROUTING =====
        function navigateTo(page, params = {}) {
            currentPage = page;
            window.location.hash = page;
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.querySelector(`[data-page="${page}"]`)?.classList.add('active');
            
            const main = document.getElementById('main-content');
            main.innerHTML = '';
            
            switch(page) {
                case 'home': renderHome(main); break;
                case 'categories': renderCategories(main); break;
                case 'chat': renderChat(main); break;
                case 'shop': renderShop(main, params.sellerId); break;
                case 'user': renderPublicUser(main, params.publicId); break;
                case 'profile': renderProfile(main); break;
                case 'search': renderSearch(main); break;
                case 'cart': renderCart(main); break;
                case 'voting': renderVoting(main); break;
                case 'wallet': renderWallet(main); break;
                case 'transfer': renderTransfer(main); break;
                case 'orders': renderOrders(main); break;
                case 'receipt': renderReceipt(main, params.orderId); break;
                case 'resell': renderResell(main); break;
                case 'resell-add': renderResellForm(main); break;
                case 'wishlist': renderWishlist(main); break;
            }
        }

        // ===== HOME =====
        async function renderHome(container) {
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
            
            const [bannersRes, popularRes, categoriesRes] = await Promise.all([
                fetch(`${API_URL}/products/banners`),
                fetch(`${API_URL}/products?sort=popular&limit=10`),
                fetch(`${API_URL}/products/categories/all`)
            ]);
            
            const banners = await bannersRes.json().catch(() => []);
            const popular = await popularRes.json().catch(() => []);
            const categories = await categoriesRes.json().catch(() => []);

            container.innerHTML = `
                <div class="home-page">
                    <div class="banner-slider">
                        ${banners.map(b => `
                            <div class="banner-slide" onclick="window.open('${b.target_link}', '_blank')">
                                <img src="${b.image_url}" alt="${b.title}">
                                <div class="banner-text">
                                    <h3>${b.title}</h3>
                                    <p>${b.subtitle}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="section-header">
                        <h3>Most Viewed</h3>
                        <button onclick="navigateTo('search', {sort: 'popular'})" class="link-btn">See All</button>
                    </div>
                    <div class="product-grid">
                        ${popular.map(p => renderProductCard(p)).join('')}
                    </div>

                    <div class="section-header">
                        <h3>Browse Categories</h3>
                    </div>
                    <div class="category-grid">
                        ${categories.map(c => `
                            <div class="category-card" onclick="navigateTo('search', {category: '${c.slug}'})">
                                <div class="category-icon"><i class="fas fa-book"></i></div>
                                <span>${c.name}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            
            initBannerSlider();
        }

        function renderProductCard(p) {
            const storeOpen = p.store_is_open !== 0 && p.store_accepting_orders !== 0;
            return `
                <div class="product-card" onclick="openProductDetail(${p.book_id})">
                    <button class="product-wishlist-btn" type="button" aria-label="Add to wishlist" onclick="event.stopPropagation(); toggleWishlist(${Number(p.book_id)}, this)"><i class="far fa-heart"></i></button><div class="product-image">
                        <img src="${p.images ? JSON.parse(p.images)[0] : '/assets/logo.png'}" alt="${p.title}">
                    </div>
                    <div class="product-info">
                        <h4 class="product-title">${p.title}</h4>
                        <p class="product-author">${p.author_name || ''}</p>
                        <div class="product-price-row">
                            <span class="price">${p.discounted_price || p.original_price} Ks</span>
                            ${p.discounted_price ? `<span class="original-price">${p.original_price} Ks</span>` : ''}
                        </div>
                        <div class="product-meta">
                            <span><i class="fas fa-eye"></i> ${p.view_count}</span>
                            <button class="store-link" onclick="event.stopPropagation(); navigateTo('shop', {sellerId: '${p.seller_id || ''}'})"><i class="fas fa-store"></i> ${escapeChatText(p.store_name || 'SPZ')}</button>
                        </div>
                        <div class="store-status-line ${storeOpen ? 'is-open' : 'is-closed'}"><i class="fas fa-circle"></i> ${storeOpen ? 'Open for orders' : 'ဆိုင်ခေတ္တပိတ်ထားသည်'}</div>
                    </div>
                </div>
            `;
        }

        // ===== PRODUCT DETAIL =====
        async function openProductDetail(bookId) {
            const modal = document.getElementById('product-modal');
            const content = document.getElementById('product-detail-content');
            content.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i></div>';
            modal.classList.remove('hidden');
            
            const res = await fetch(`${API_URL}/products/${bookId}`);
            const p = await res.json();
            
            const images = p.images ? JSON.parse(p.images) : [];
            const variations = p.variations || [];
            const storeOpen = p.store_is_open !== 0 && p.store_accepting_orders !== 0;
            
            content.innerHTML = `
                <div class="product-detail">
                    <div class="image-gallery">
                        <div class="main-image">
                            <img id="main-product-img" src="${images[0] || '/assets/logo.png'}" alt="${p.title}">
                        </div>
                        <div class="thumbnail-row">
                            ${images.map((img, i) => `
                                <img src="${img}" onclick="document.getElementById('main-product-img').src='${img}'" class="${i===0?'active':''}">
                            `).join('')}
                        </div>
                    </div>
                    
                    <div class="detail-info">
                        <h2>${p.title}</h2>
                        <p class="author">${p.author_name || 'Unknown Author'}</p>
                        <div class="price-block">
                            <span class="current-price">${p.discounted_price || p.original_price} Ks</span>
                            ${p.discounted_price ? `<span class="original-price">${p.original_price} Ks</span>` : ''}
                        </div>
                        <div class="shop-response-card ${storeOpen ? 'is-open' : 'is-closed'}"><i class="fas fa-${storeOpen ? 'clock' : 'store-slash'}"></i><div><strong>${storeOpen ? (p.reply_time_text || 'Usually replies within 1 hour') : 'ဆိုင်ခေတ္တပိတ်ထားပါတယ်'}</strong><small>${storeOpen ? 'ဆိုင်ဖွင့်နေပြီး အော်ဒါလက်ခံနေပါတယ်' : (p.closed_message || 'ပြန်ဖွင့်ချိန်တွင် အော်ဒါလက်ခံပါမယ်')}</small></div></div>
                        
                        <div class="variation-selector">
                            <label>Variation</label>
                            <select id="variation-select" onchange="updateVariationPrice(this)">
                                ${variations.map(v => `<option value="${v.variation_id}" data-price="${v.price}" data-stock="${v.stock_quantity}">${v.variation_name}</option>`).join('')}
                                ${variations.length === 0 ? `<option value="0" data-price="${p.discounted_price || p.original_price}" data-stock="${p.stock_quantity}">Standard</option>` : ''}
                            </select>
                        </div>

                        <div class="detail-meta">
                            <span><i class="fas fa-file-alt"></i> ${p.page_count || 'N/A'} pages</span>
                            <span><i class="fas fa-ruler"></i> ${p.size || 'N/A'}</span>
                            <span><i class="fas fa-boxes"></i> Stock: <span id="stock-display">${p.stock_quantity}</span></span>
                        </div>

                        <div class="description">
                            <h4>Description</h4>
                            <p>${p.description || 'No description available.'}</p>
                        </div>

                        <div class="detail-actions">
                            <button ${storeOpen ? '' : 'disabled'} onclick="addToCart(${p.book_id})" class="btn-secondary"><i class="fas fa-cart-plus"></i> ${storeOpen ? 'Add to Cart' : 'Store Closed'}</button>
                            <button ${storeOpen ? '' : 'disabled'} onclick="buyNow(${p.book_id})" class="btn-primary"><i class="fas fa-bolt"></i> ${storeOpen ? 'Buy Now' : 'Unavailable'}</button>
                            <button onclick="toggleWishlist(${p.book_id})" class="btn-icon"><i class="far fa-heart"></i></button>
                        </div>

                        <div class="share-row">
                            <button onclick="shareProduct('${p.public_id}')" class="btn-text"><i class="fas fa-share-alt"></i> Share</button>
                            <button onclick="startChat(${Number(p.seller_id) || 0}, ${Number(p.book_id) || 0})" class="btn-text"><i class="fas fa-comment"></i> Contact Shop</button>
                            <button onclick="navigateTo('shop', {sellerId: '${p.seller_id || ''}'})" class="btn-text"><i class="fas fa-store"></i> Visit Shop</button>
                        </div>
                    </div>

                    <div class="reviews-section">
                        <h4>Reviews (${p.reviews?.length || 0})</h4>
                        ${p.reviews?.length ? p.reviews.map(r => `
                            <div class="review-card">
                                <div class="review-header">
                                    <span class="reviewer">${r.user_name}</span>
                                    <div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div>
                                </div>
                                <p>${r.comment}</p>
                            </div>
                        `).join('') : '<p class="empty-text">No reviews yet. Purchase and review this book!</p>'}
                    </div>
                </div>
            `;
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        
        // ===== CATEGORIES =====
        function renderCategories(container) {
            container.innerHTML = `
                <div class="categories-page">
                    <h2>Categories</h2>
                    <div class="category-list" id="category-list"></div>
                </div>
            `;
            fetch(`${API_URL}/products/categories/all`)
                .then(r => r.json())
                .then(cats => {
                    document.getElementById('category-list').innerHTML = cats.map(c => `
                        <div class="category-list-item" onclick="navigateTo('search', {category: '${c.slug}'})">
                            <div class="cat-icon"><i class="fas fa-bookmark"></i></div>
                            <div class="cat-info">
                                <h4>${c.name}</h4>
                                <span>Explore books</span>
                            </div>
                            <i class="fas fa-chevron-right"></i>
                        </div>
                    `).join('');
                });
        }

        // ===== CHAT =====
        async function renderChat(container) {
            if (!currentUser) { showAuthModal(); return; }
            
            container.innerHTML = `
                <div class="chat-page">
                    <h2>Messages</h2>
                    <div class="chat-tabs">
                        <button class="chat-tab active" onclick="loadConversations('all')">All</button>
                        <button class="chat-tab" onclick="loadConversations('buyer_shop')">Shops</button>
                        <button class="chat-tab" onclick="loadConversations('group')">Groups</button>
                    </div>
                    <div id="conversation-list" class="conversation-list"></div>
                </div>
            `;
            loadConversations('all');
        }

        function escapeChatText(value) {
            return String(value || '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[ch]));
        }

            const res = await fetch(`${API_URL}/chat/conversations`, {

            if (!res.ok || !Array.isArray(convs)) throw new Error(convs.error || 'Unable to load conversations');

            document.getElementById('conversation-list').innerHTML = filtered.map(c => `

        async function openChat(conversationId) {
            const main = document.getElementById('main-content');
            main.innerHTML = `<div class="chat-page"><button class="btn-text" onclick="navigateTo('chat')"><i class="fas fa-arrow-left"></i> Back to messages</button><h2>Conversation #${conversationId}</h2><div id="message-list" class="message-list"><p class="loading">Loading messages...</p></div><form class="chat-compose" onsubmit="sendChatMessage(event, ${conversationId})"><input id="chat-message-input" required maxlength="2000" placeholder="Write a message..."><button class="btn-primary" type="submit"><i class="fas fa-paper-plane"></i> Send</button></form></div>`;
            try {
                const res = await fetch(`${API_URL}/chat/${conversationId}`, { headers: { 'Authorization': `Bearer ${authToken}` } });
                const messages = await res.json();
                if (!res.ok) throw new Error(messages.error || 'Unable to load messages');
                if (!Array.isArray(messages)) throw new Error('Unable to load messages');
                const myId = `U${currentUser.user_id || currentUser.id}`;
                document.getElementById('message-list').innerHTML = messages.map(m => `<div class="message-bubble ${String(m.sender_id) === myId ? 'mine' : 'theirs'}"><div>${m.message_type === 'image' ? `<img src="${escapeChatText(m.content)}" alt="Chat image">` : escapeChatText(m.content)}</div><small>${m.sender_public_id ? `<button class="chat-user-link" onclick="navigateTo('user', {publicId: '${escapeChatText(m.sender_public_id)}'})">${escapeChatText(m.sender_name || 'View profile')}</button>` : escapeChatText(m.sender_name || '')} · ${m.created_at ? new Date(m.created_at).toLocaleString() : ''}</small></div>`).join('') || '<p class="empty-text">No messages yet</p>';

        async function sendChatMessage(event, conversationId) {
            event.preventDefault();
            const input = document.getElementById('chat-message-input');
            const content = String(input.value || '').trim(); if (!content) return;
            input.disabled = true;
            const res = await fetch(`${API_URL}/chat`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` }, body: JSON.stringify({ conversation_id: conversationId, content }) });
            const data = await res.json();
            input.disabled = false;
            if (!res.ok) return alert(data.error || 'Unable to send message');
            openChat(conversationId);
        }

        async function deleteChat(conversationId) {
            if (!confirm('ဒီ chat ကို သင့် chat list မှ ဖျက်မလား?')) return;

            const data = await res.json();
            if (!res.ok) return alert(data.error || 'Unable to delete chat');
            loadConversations('all');
        }

        async function downloadReceipt(format) {
            if (!currentReceiptData) return;
            const { receipt, verification_code } = currentReceiptData;
            const canvas = document.createElement('canvas'); canvas.width = 794; canvas.height = 1123;
            const ctx = canvas.getContext('2d'); ctx.fillStyle = '#fffdf8'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#173b2a';
            const text = (value, x, y, size = 22, color = '#173b2a', weight = '400') => { ctx.font = `${weight} ${size}px Arial, sans-serif`; ctx.fillStyle = color; ctx.fillText(String(value), x, y); };
            const logo = new Image(); logo.crossOrigin = 'anonymous'; logo.src = '/assets/logo.png';
            await new Promise(resolve => { logo.onload = resolve; logo.onerror = resolve; });
            if (logo.naturalWidth) ctx.drawImage(logo, 347, 42, 100, 100);
            text('SAR PAY ZONE', 250, 176, 28, '#173b2a', '700'); text('PURCHASE RECEIPT', 300, 207, 16, '#6f7c73', '400');
            ctx.strokeStyle = '#d6dfd8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(55, 232); ctx.lineTo(739, 232); ctx.stroke();
            text(`Date & time: ${new Date(receipt.created_at).toLocaleString()}`, 60, 270, 17); text(`Order ID: ${receipt.order_number || receipt.order_id}`, 60, 300, 17); text(`Book shop: ${receipt.store_name || 'Sar Pay Zone'}`, 60, 346, 20, '#173b2a', '700');
            let bookImage = null; try { bookImage = receipt.images ? JSON.parse(receipt.images)[0] : null; } catch (_) {}
            const cover = new Image(); cover.crossOrigin = 'anonymous'; cover.src = bookImage || '/assets/logo.png'; await new Promise(resolve => { cover.onload = resolve; cover.onerror = resolve; }); if (cover.naturalWidth) ctx.drawImage(cover, 60, 382, 170, 170);
            text(receipt.title || 'Book', 260, 420, 22, '#173b2a', '700'); text(`Author: ${receipt.author_name || 'Unknown'}`, 260, 458, 18); text(`Quantity: ${receipt.quantity || 1}`, 260, 492, 18); text(`Book amount: ${Number(receipt.total_amount || 0).toLocaleString()} Ks`, 260, 526, 18);
            ctx.strokeStyle = '#d6dfd8'; ctx.beginPath(); ctx.moveTo(55, 590); ctx.lineTo(739, 590); ctx.stroke(); text('Shipping', 60, 635, 18); text(`${Number(receipt.shipping_fee || 0).toLocaleString()} Ks`, 600, 635, 18); text('TOTAL', 60, 685, 24, '#173b2a', '700'); text(`${(Number(receipt.total_amount || 0) + Number(receipt.shipping_fee || 0)).toLocaleString()} Ks`, 560, 685, 24, '#173b2a', '700'); text(`Payment: ${receipt.payment_method || '-'}`, 60, 730, 17, '#6f7c73'); text(`Status: ${receipt.order_status || '-'}`, 60, 758, 17, '#6f7c73');
            ctx.fillStyle = '#edf5ef'; ctx.fillRect(55, 830, 684, 130); text('VERIFICATION CODE', 80, 870, 15, '#6f7c73', '700'); text(verification_code, 80, 910, 24, '#173b2a', '700'); text('Signed receipt — keep this code to detect altered copies.', 80, 940, 14, '#6f7c73'); text('Thank you for shopping with Sar Pay Zone', 245, 1030, 16, '#173b2a');
            const link = document.createElement('a'); link.download = `sarpayzone-receipt-${receipt.order_number || receipt.order_id}.${format === 'jpeg' ? 'jpg' : 'png'}`; link.href = canvas.toDataURL(`image/${format}`, .95); link.click();
        }

        async function confirmCodDelivery(orderId) {
            const input = document.createElement('input');

            input.onchange = async () => {
                if (!input.files[0]) return;
                const form = new FormData(); form.append('proof', input.files[0]);
                const res = await fetch(`${API_URL}/orders/${orderId}/cod/buyer-confirm`, { method: 'POST', headers: { 'Authorization': `Bearer ${authToken}` }, body: form });
                const data = await res.json();
                if (!res.ok) return alert(data.error || 'Unable to confirm delivery');
                alert('Delivery confirmed. The shop will confirm cash settlement next.');
                navigateTo('orders');
            };
            input.click();
        }

        async function submitResellListing(event) {
            event.preventDefault();
            const formEl = event.currentTarget;
            const photoInputs = ['front', 'back', 'spine', 'inside', 'cover'].map(name => document.getElementById(`resell-${name}`));
            const files = photoInputs.map(input => input.files[0]);
            const error = document.getElementById('resell-form-error');
            const submit = document.getElementById('resell-submit');
            if (files.some(file => !file)) { error.textContent = 'စာအုပ်အရှေ့၊ အနောက်၊ ကျောရိုး၊ အတွင်းနှင့် စာအုပ်ပုံ ၅ မျိုးလုံးကို Camera ဖြင့် ရိုက်တင်ပါ'; return; }
            const form = new FormData();
            form.append('title', document.getElementById('resell-title').value.trim());
            form.append('author_name', document.getElementById('resell-author').value.trim());
            form.append('isbn', document.getElementById('resell-isbn').value.trim());
            form.append('publisher', document.getElementById('resell-publisher').value.trim());
            form.append('condition_status', document.getElementById('resell-condition').value);
            form.append('condition_note', document.getElementById('resell-note').value.trim());
            form.append('asking_price', document.getElementById('resell-price').value);
            ['front', 'back', 'spine', 'inside', 'cover'].forEach((name, index) => form.append(name, files[index]));
            submit.disabled = true; error.textContent = '';
            try {
                const res = await fetch(`${API_URL}/resell/list`, { method: 'POST', headers: { 'Authorization': `Bearer ${authToken}` }, body: form });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Unable to create resell listing');
                alert('စာအုပ်ကို Admin စစ်ဆေးရန် တင်ပြီးပါပြီ။');
                navigateTo('resell');
            } catch (err) { error.textContent = err.message; submit.disabled = false; }
        }

                alert(err.message);
            }

        function renderCartItems() {
            const container = document.getElementById('cart-items');
            if (!container) return;
            
            const groups = cart.reduce((map, item, index) => {
                const key = item.seller_id || `unknown-${index}`;
                if (!map[key]) map[key] = { seller_id: key, store_name: item.store_name || 'စာပေဇုန်ဆိုင်', items: [] };
                map[key].items.push({ ...item, index });
                return map;
            }, {});
            let total = 0;
            container.innerHTML = Object.values(groups).map(group => {
                const shopTotal = group.items.reduce((sum, item) => sum + item.price * item.qty, 0);
                total += shopTotal;
                return `
                    <section class="cart-shop-group">
                        <div class="cart-shop-heading"><span><i class="fas fa-store"></i> ${group.store_name}</span><small>${group.items.length} မျိုး</small></div>
                        ${group.items.map(item => `
                            <div class="cart-item">
                                <img src="${item.image}" alt="${item.title}">
                                <div class="cart-item-info">
                                    <h4>${item.title}</h4>
                                    <p class="cart-item-price">${item.price.toLocaleString()} Ks</p>
                                    <div class="quantity-control">
                                        <button onclick="changeCartQty(${item.index}, -1)" aria-label="Decrease quantity">−</button>
                                        <strong>${item.qty}</strong>
                                        <button onclick="changeCartQty(${item.index}, 1)" aria-label="Increase quantity">+</button>
                                    </div>
                                </div>
                                <div class="cart-item-end"><strong>${(item.price * item.qty).toLocaleString()} Ks</strong><button onclick="removeFromCart(${item.index})" class="btn-icon danger" aria-label="Remove item"><i class="fas fa-trash"></i></button></div>
                            </div>
                        `).join('')}
                        <div class="cart-shop-shipping"><i class="fas fa-route"></i> ဒီဆိုင်အတွက် ပို့ခတစ်ကြိမ် — checkout တွင် မြို့နယ်အလိုက်တွက်ပါမယ်</div>
                    </section>
                `;
            }).join('') || '<p class="empty-text">Your cart is empty</p>';
            
            const totalEl = document.getElementById('cart-total');
            if (totalEl) totalEl.textContent = total.toLocaleString();
        }

        function changeCartQty(index, delta) {
            if (!cart[index]) return;
            cart[index].qty = Math.max(1, cart[index].qty + delta);
            localStorage.setItem('spz_cart', JSON.stringify(cart));
            renderCartItems();
        }

        async function addToCart(bookId) {
            try {
                const res = await fetch(`${API_URL}/products/${bookId}`);
                const p = await res.json();
                if (!res.ok) throw new Error(p.error || 'Unable to load product');
                const images = p.images ? JSON.parse(p.images) : [];
                const price = Number(p.discounted_price || p.original_price || 0);
                const existing = cart.find(item => item.book_id === bookId);
                if (existing) existing.qty += 1;
                else cart.push({ book_id: bookId, title: p.title, price, qty: 1, image: images[0] || '/assets/logo.png', seller_id: p.seller_id, store_name: p.store_name || 'စာပေဇုန်ဆိုင်' });
                localStorage.setItem('spz_cart', JSON.stringify(cart));
                alert('Added to cart');
            } catch (err) {
                alert(err.message || 'Unable to add this book to cart');
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            localStorage.setItem('spz_cart', JSON.stringify(cart));
            renderCartItems();
        }

            await addToCart(bookId);

            if (!currentUser) { showAuthModal(); return; }
            if (!cart.length) { alert('ခြင်းတောင်းထဲတွင် ပစ္စည်းမရှိသေးပါ'); return; }
            document.getElementById('checkout-error').textContent = '';
            document.getElementById('checkout-modal').classList.remove('hidden');
        }

        function closeCheckoutModal() { document.getElementById('checkout-modal').classList.add('hidden'); }

        async function submitCheckout() {
            const shipping_state = document.getElementById('checkout-state').value;
            const shipping_district = document.getElementById('checkout-district').value.trim();
            const shipping_township = document.getElementById('checkout-township').value.trim();
            const shipping_address = document.getElementById('checkout-address').value.trim();
            const payment_method = document.getElementById('checkout-payment').value;
            const errorBox = document.getElementById('checkout-error');
            if (!shipping_state || !shipping_district || !shipping_township || !shipping_address) {
                errorBox.textContent = 'ပြည်နယ်၊ ခရိုင်၊ မြို့နယ်နှင့် အသေးစိတ်လိပ်စာကို ဖြည့်ပါ'; return;
            }
            const submitButton = document.querySelector('#checkout-modal .btn-primary');
            submitButton.disabled = true;
            const res = await fetch(`${API_URL}/orders/bulk`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                body: JSON.stringify({ items: cart.map(item => ({ product_id: item.book_id, quantity: item.qty })), shipping_address, shipping_state, shipping_district, shipping_township, payment_method })
            });
            const data = await res.json();
            submitButton.disabled = false;
            if (!res.ok) { errorBox.textContent = data.error || 'အော်ဒါတင်၍ မရပါ'; return; }
            closeCheckoutModal();
            alert(`အော်ဒါတင်ပြီးပါပြီ\nစာအုပ်ဖိုး ${Number(data.merchandise_total).toLocaleString()} Ks\nပို့ခ ${Number(data.shipping_total).toLocaleString()} Ks\nစုစုပေါင်း ${Number(data.total).toLocaleString()} Ks`);
            cart = [];
            localStorage.setItem('spz_cart', JSON.stringify(cart));
            navigateTo('orders');
        }

        function showWithdrawForm() {
            const amount = prompt('Withdrawal amount (Ks)');
            const method = prompt('Wallet: kpay, wavepay, or ayapay');
            const phone = prompt('Wallet phone number (09...)');
            const accountName = prompt('Wallet account name');
            if (!amount || !method || !phone || !accountName) return;
            const numericAmount = Number(amount);
            if (!Number.isFinite(numericAmount) || numericAmount <= 0) return alert('Enter a valid withdrawal amount');
            if (!confirm(`Step 1 of 2 — Review withdrawal\n\nAmount: ${numericAmount.toLocaleString()} Ks\nWallet: ${method}\nPhone: ${phone}\nAccount name: ${accountName}\n\nContinue to final confirmation?`)) return;
            if (!confirm(`Step 2 of 2 — Final confirmation\n\nSubmit this withdrawal request for ${numericAmount.toLocaleString()} Ks?\n\nConfirm and continue?`)) return;
            fetch(`${API_URL}/wallet/withdraw`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                body: JSON.stringify({ amount: numericAmount, payment_method: method.toLowerCase(), account_name: accountName, account_phone: phone })
            }).then(r => r.json().then(data => alert(r.ok ? 'Withdrawal request submitted for Admin review' : (data.error || 'Withdrawal failed'))));
        }

            container.innerHTML = `<div class="transfer-page"><button class="btn-text" onclick="navigateTo('wallet')"><i class="fas fa-arrow-left"></i> Back to wallet</button><div class="page-heading"><p class="eyebrow">Wallet</p><h2>Transfer to another user</h2><p class="text-secondary">လွှဲမည့်သူ၏ Public ID နှင့် ပမာဏကို ထည့်ပါ။ ငွေလွှဲမတိုင်မီ နှစ်ဆင့် အတည်ပြုရပါမည်။</p></div><div class="transfer-balance">Available balance: <strong>${Number(wallet.balance || 0).toLocaleString()} Ks</strong></div><form id="transfer-form" class="transfer-form"><div class="form-group"><label>Recipient Public ID *</label><input id="transfer-recipient" required placeholder="ဥပမာ U#000001"></div><div class="form-group"><label>Amount (Ks) *</label><input id="transfer-amount" type="number" min="1" max="150000" step="1" required placeholder="10000"><small>Daily limit: 150,000 Ks · Transfer fee: 3%</small></div><div class="form-group"><label>Note</label><textarea id="transfer-note" rows="3" maxlength="200" placeholder="မှတ်ချက် (optional)"></textarea></div><p id="transfer-error" class="error-text"></p><button class="btn-primary" type="submit">Review Transfer</button></form></div>`;
            document.getElementById('transfer-form').addEventListener('submit', submitTransfer);
        }

        async function submitTransfer(event) {
            event.preventDefault();
            const recipient = document.getElementById('transfer-recipient').value.trim();
            const amount = Number(document.getElementById('transfer-amount').value);
            const note = document.getElementById('transfer-note').value.trim();
            const error = document.getElementById('transfer-error');
            if (!recipient || !Number.isFinite(amount) || amount <= 0 || amount > 150000) { error.textContent = 'Enter a valid recipient and amount up to 150,000 Ks.'; return; }
            const fee = amount * 0.03; const total = amount + fee;
            if (!confirm(`Step 1 of 2 — Review\n\nRecipient: ${recipient}\nSend amount: ${amount.toLocaleString()} Ks\nFee (3%): ${fee.toLocaleString()} Ks\nTotal deducted: ${total.toLocaleString()} Ks\n\nContinue to final confirmation?`)) return;
            if (!confirm(`Step 2 of 2 — Final confirmation\n\nYou are about to transfer ${amount.toLocaleString()} Ks to ${recipient}.\nThis action cannot be reversed after completion.\n\nConfirm and send now?`)) return;
            const button = event.currentTarget.querySelector('button[type="submit"]'); button.disabled = true; error.textContent = '';
            try {
                const res = await fetch(`${API_URL}/wallet/p2p`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` }, body: JSON.stringify({ recipient_public_id: recipient, amount, note }) });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Transfer failed');
                alert(`Transfer completed. ${amount.toLocaleString()} Ks sent.`);
                navigateTo('wallet');
            } catch (err) { error.textContent = err.message; button.disabled = false; }
        }

        async function showResellForm() {
            const title = prompt('Book title');
            const author_name = prompt('Author name (optional)') || '';
            const isbn = prompt('ISBN (optional)') || '';
            const publisher = prompt('Publisher (optional)') || '';
            const condition_status = prompt('Condition: new, like_new, good, fair, or poor', 'good') || 'good';
            const condition_note = prompt('Describe the book condition, damage, writing, or missing pages');
            const asking_price = prompt('Asking price (Ks)');
            if (!title || !condition_note || !asking_price) return;
            const photoInput = document.createElement('input');
            photoInput.type = 'file'; photoInput.accept = 'image/*'; photoInput.multiple = true;
            photoInput.onchange = async () => {
                if (!photoInput.files.length || photoInput.files.length > 5) return alert('Please choose between 1 and 5 condition photos');
                const form = new FormData();
                form.append('title', title); form.append('author_name', author_name); form.append('isbn', isbn); form.append('publisher', publisher);
                form.append('condition_status', condition_status); form.append('condition_note', condition_note); form.append('asking_price', asking_price);
                [...photoInput.files].forEach(file => form.append('condition_images', file));
                const res = await fetch(`${API_URL}/resell/list`, { method: 'POST', headers: { 'Authorization': `Bearer ${authToken}` }, body: form });
                const data = await res.json();
                alert(res.ok ? 'Standalone resell book submitted for Admin review' : (data.error || 'Unable to create resell listing'));
            };
            photoInput.click();
        }

        async function startChat(sellerId, bookId) {
            if (!currentUser) { showAuthModal(); return; }
            const numericSellerId = Number(sellerId);
            if (!Number.isSafeInteger(numericSellerId) || numericSellerId <= 0) { alert('Shop contact is unavailable for this product.'); return; }
            try {
                const res = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                    body: JSON.stringify({ conversation_type: 'buyer_shop', participants: [`U${Number(currentUser.user_id || currentUser.id)}`, `S${numericSellerId}`] })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Unable to start chat');
                if (data.store_reply?.auto_reply_message || data.store_reply?.reply_time_text) {
                    alert(`${data.store_reply.auto_reply_message || 'Message sent.'}\n\n${data.store_reply.reply_time_text || ''}`);
                }
                openChat(data.conversation_id);
            } catch (err) {
                alert(err.message || 'Unable to start chat');
            }
        }
        function shareProduct(publicId) { navigator.clipboard?.writeText(`${location.origin}${location.pathname}?product=${publicId}`); alert('Product link copied'); }
        function openReviewForm(orderId) {
            const rating = Number(prompt('Rating from 1 to 5', '5'));
            const comment = prompt('Review comment') || '';
            if (!rating) return;
            fetch(`${API_URL}/orders/${orderId}/review`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                body: JSON.stringify({ rating, comment })
            }).then(r => r.json().then(data => alert(r.ok ? 'Review submitted' : (data.error || 'Review failed'))));
        }

        // ===== UTILITIES =====
        function logout() {
            localStorage.removeItem('spz_token');
            authToken = null;
            currentUser = null;
            location.reload();
        }

        function toggleNightMode() {
            document.body.classList.toggle('night-mode');
            localStorage.setItem('spz_night', document.body.classList.contains('night-mode'));
        }

        function initBannerSlider() {
            // Simple auto-slide
            const slides = document.querySelectorAll('.banner-slide');
            let current = 0;
            if (slides.length <= 1) return;
            
            setInterval(() => {
                slides.forEach((s, i) => s.style.display = i === current ? 'block' : 'none');
                current = (current + 1) % slides.length;
            }, 5000);
            slides.forEach((s, i) => s.style.display = i === 0 ? 'block' : 'none');
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        async function requestPushPermission() {
            if ('serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && Notification.permission !== 'denied') {
                try {
                    if (Notification.permission === 'default') await Notification.requestPermission();
                    if (Notification.permission !== 'granted') return;
                    const reg = await navigator.serviceWorker.register('/service-worker.js');
                    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array('BB4adKD_jrSODVxxlh9R4-OOm0Bu8NIAfv507H6ZC0_12nvjVyQO0yjkRwIJnzUHhuQ8YV9W6ZLhdZNVS2dsmx0') });
                    await fetch(`${API_URL}/push/subscribe`, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${authToken}`
                        },
                        body: JSON.stringify({
                            endpoint: sub.endpoint,
                            keys: { p256dh: btoa(String.fromCharCode(...new Uint8Array(sub.getKey('p256dh')))), auth: btoa(String.fromCharCode(...new Uint8Array(sub.getKey('auth')))) }
                        })
                    });
                } catch (err) {
                    console.log('Push notification permission denied');
                }
            }
        }

        // Init
        if (localStorage.getItem('spz_night') === 'true') document.body.classList.add('night-mode');
        
        // Check if returning from shared link
        const urlParams = new URLSearchParams(window.location.search);
        const sharedProduct = urlParams.get('product');
        if (sharedProduct) {
            // Would redirect to product after login
            localStorage.setItem('spz_redirect', sharedProduct);
        }
    </script>
