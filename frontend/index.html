<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sar Pay Zone - စာပေဇုန်</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Myanmar:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Password Code Gate -->
    <div id="password-gate" class="gate-overlay">
        <div class="gate-box">
            <div class="logo-slot">
                <img src="/assets/logo.png" alt="Sar Pay Zone" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'" width="200">
                <div class="logo-fallback" style="display:none;"><i class="fas fa-book-open"></i></div>
            </div>
            <h2>ဆိုင်သို့ ဝင်ရောက်ရန်</h2>
            <p class="gate-subtitle">ဆိုင်စာမျက်နှာတွင် ပြသထားသော ၆ လုံး Password Code ကို ထည့်ပါ</p>
            <input type="password" id="password-code" placeholder="၆ လုံးကုဒ်" maxlength="6" inputmode="numeric" pattern="[0-9]{6}">
            <button onclick="checkPasswordCode()" class="btn-primary">ဆိုင်ထဲသို့ ဝင်မည်</button>
            <p id="gate-error" class="error-text"></p>
        </div>
    </div>

<!-- Auth Modal -->
<div id="auth-modal" class="modal hidden">

    <!-- အပေါ်တစ်ဝက်အတွက် GIF Animation နေရာ -->
    <div class="auth-gif-wrapper">
        <img src="assets/logo.gif" alt="Sar Pay Zone Animation">
    </div>

    <!-- အောက်တစ်ဝက်အတွက် Login/Register Form -->
    <div class="modal-content auth-modal-content">
        <h2 class="auth-title">Welcome to Sar Pay Zone</h2>

        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchAuthTab('login')">Login</button>
            <button class="auth-tab" onclick="switchAuthTab('register')">Register</button>
        </div>

        <div id="auth-login" class="auth-form">
            <input type="tel" id="login-phone" placeholder="Phone Number" maxlength="15">
            <input type="password" id="login-password" placeholder="Password" minlength="8">
            <button onclick="login()" class="btn-primary">Login</button>
        </div>

        <div id="auth-register" class="auth-form hidden">
            <input type="text" id="reg-name" placeholder="Full Name" maxlength="100">
            <input type="tel" id="reg-phone" placeholder="Phone Number" maxlength="15">
            <input type="password" id="reg-password" placeholder="Password (min 8 chars)" minlength="8">
            <input type="text" id="reg-city" placeholder="City (optional)">
            <button onclick="register()" class="btn-primary">Create Account</button>
        </div>

        <p id="auth-error" class="error-text"></p>
    </div>
</div>

    <div id="checkout-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="checkout-title">
        <div class="modal-content checkout-form-card">
            <div class="modal-header"><div><p class="eyebrow">ပို့ဆောင်ရန်လိပ်စာ</p><h2 id="checkout-title">အော်ဒါတင်ရန် အချက်အလက်</h2></div><button class="icon-btn" onclick="closeCheckoutModal()" aria-label="ပိတ်ရန်"><i class="fas fa-times"></i></button></div>
            <p class="small text-secondary checkout-note">လက်ခံမည့်လိပ်စာနှင့် ဆက်သွယ်ရန်ဖုန်းနံပါတ်ကို ထည့်ပါ။ ပို့ခခန့်မှန်းငွေကို ပစ္စည်းရောက်မှ ပေးချေရပါမည်။</p>
            <div class="form-group"><label for="checkout-address">လက်ခံမည့်အသေးစိတ်လိပ်စာ</label><textarea id="checkout-address" maxlength="500" placeholder="အိမ်အမှတ်၊ လမ်း၊ ရပ်ကွက်၊ မြို့/ပြည်နယ်၊ ဆက်သွယ်ရန်ဖုန်းနံပါတ်"></textarea></div>
            <div class="form-group"><label for="checkout-payment">ငွေပေးချေမှုနည်းလမ်း</label><select id="checkout-payment"><option value="wallet">Wallet ဖြင့်ပေးချေမည်</option><option value="cod">ပစ္စည်းရောက်မှ ငွေချေမည် (COD)</option></select></div>
            <p id="checkout-error" class="error-text"></p><button onclick="submitCheckout()" class="btn-primary">အော်ဒါတင်မည်</button>
        </div>
    </div>
    <div id="wallet-receipt-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="wallet-receipt-title">
        <div class="modal-content wallet-receipt-dialog">
            <div class="modal-header"><div><p class="eyebrow">SarPayPay</p><h2 id="wallet-receipt-title">လုပ်ဆောင်မှုအောင်မြင်ပါသည်</h2></div><button class="icon-btn" onclick="closeWalletReceipt()" aria-label="ပိတ်ရန်"><i class="fas fa-times"></i></button></div>
            <div class="receipt wallet-receipt-card" id="wallet-receipt-card"><div id="wallet-receipt-amount" class="r-amount"></div><div id="wallet-receipt-recipient" class="r-name"></div><div id="wallet-receipt-reference" class="r-id"></div><div id="wallet-receipt-received" class="r-received"></div><div id="wallet-receipt-type" class="r-type"></div><div id="wallet-receipt-date" class="r-date"></div><div id="wallet-receipt-time" class="r-time"></div><div id="wallet-receipt-fee" class="r-fee"></div><div id="wallet-receipt-transaction" class="r-transaction"></div><div id="wallet-receipt-note" class="r-note"></div></div>
            <div class="wallet-receipt-actions"><button class="btn-secondary" onclick="downloadWalletReceiptJpg()"><i class="fas fa-download"></i> JPG ဒေါင်းလုဒ်</button><button class="btn-primary" onclick="closeWalletReceipt()">ပြီးပါပြီ</button></div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="hidden">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-slot-header">
                <img src="/assets/logo.png" alt="SPZ" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                <div class="logo-fallback" style="display:none;"><i class="fas fa-book-open"></i></div>
            </div>
            <div class="header-actions">
                <button onclick="navigateTo('search')" class="icon-btn"><i class="fas fa-search"></i></button>
                <button onclick="navigateTo('cart')" class="icon-btn"><i class="fas fa-shopping-bag"></i></button>
            </div>
        </header>

        <!-- Content Area -->
        <main id="main-content" class="main-content"></main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button onclick="navigateTo('home')" class="nav-item active" data-page="home">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </button>
            <button onclick="navigateTo('categories')" class="nav-item" data-page="categories">
                <i class="fas fa-th-large"></i>
                <span>Categories</span>
            </button>
            <button onclick="navigateTo('chat')" class="nav-item" data-page="chat">
                <i class="fas fa-comment-dots"></i>
                <span>Chat</span>
            </button>
            <button onclick="navigateTo('profile')" class="nav-item" data-page="profile">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </button>
        </nav>
    </div>

    <!-- Product Detail Modal -->
    <div id="product-modal" class="modal hidden">
        <div class="modal-content product-modal-content">
            <button onclick="closeModal('product-modal')" class="close-btn"><i class="fas fa-times"></i></button>
            <div id="product-detail-content"></div>
        </div>
    </div>

    <script>
        // ===== STATE MANAGEMENT =====
        const API_URL = 'https://sarpayzone-production.up.railway.app/api';
        let currentUser = null;
        let authToken = localStorage.getItem('spz_token');
        let currentPage = 'home';
        let cart = JSON.parse(localStorage.getItem('spz_cart') || '[]');

        // ===== PASSWORD GATE =====
        async function checkPasswordCode() {
            const code = document.getElementById('password-code').value;
            try {
                const res = await fetch(`${API_URL}/auth/buyer/check-code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password_code: code })
                });
                if (res.ok) {
                    document.getElementById('password-gate').classList.add('hidden');
                    if (authToken) {
                        await loadUser();
                        showApp();
                    } else {
                        showAuthModal();
                    }
                } else {
                    document.getElementById('gate-error').textContent = 'Invalid access code';
                }
            } catch (err) {
                document.getElementById('gate-error').textContent = 'Connection error';
            }
        }

        // ===== AUTH =====
        function showAuthModal() {
            document.getElementById('auth-modal').classList.remove('hidden');
        }

        function switchAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.auth-tab:nth-child(${tab === 'login' ? 1 : 2})`)?.classList.add('active');
            document.getElementById('auth-login').classList.toggle('hidden', tab !== 'login');
            document.getElementById('auth-register').classList.toggle('hidden', tab !== 'register');
        }

        async function login() {
            const phone = document.getElementById('login-phone').value;
            const password = document.getElementById('login-password').value;
            try {
                const res = await fetch(`${API_URL}/auth/buyer/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });
                const data = await res.json();
                if (res.ok) {
                    authToken = data.token;
                    localStorage.setItem('spz_token', authToken);
                    currentUser = data.user;
                    showApp();
                } else {
                    document.getElementById('auth-error').textContent = data.error;
                }
            } catch (err) {
                document.getElementById('auth-error').textContent = 'Login failed';
            }
        }

        async function register() {
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;
            const password = document.getElementById('reg-password').value;
            const city = document.getElementById('reg-city').value;
            try {
                const res = await fetch(`${API_URL}/auth/buyer/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone, password, city })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('Registration successful! Please login.');
                    switchAuthTab('login');
                } else {
                    document.getElementById('auth-error').textContent = data.error;
                }
            } catch (err) {
                document.getElementById('auth-error').textContent = 'Registration failed';
            }
        }

        async function loadUser() {
            const res = await fetch(`${API_URL}/auth/me`, {
                headers: { 'Authorization': `Bearer ${authToken}` }
            });
            if (res.ok) {
                const data = await res.json();
                currentUser = data.user;
            } else {
                localStorage.removeItem('spz_token');
                authToken = null;
            }
        }

        function showApp() {
            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            requestPushPermission();
            navigateTo('home');
        }

        // ===== ROUTING =====
        function navigateTo(page, params = {}) {
            currentPage = page;
            window.location.hash = page;
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.querySelector(`[data-page="${page}"]`)?.classList.add('active');

            const main = document.getElementById('main-content');
            main.innerHTML = '';

            switch(page) {
                case 'home': renderHome(main); break;
                case 'categories': renderCategories(main); break;
                case 'chat': renderChat(main); break;
                case 'shop': renderShop(main, params.sellerId); break;
                case 'user': renderPublicUser(main, params.publicId); break;
                case 'profile': renderProfile(main); break;
                case 'search': renderSearch(main); break;
                case 'cart': renderCart(main); break;
                case 'voting': renderVoting(main); break;
                case 'wallet': renderWallet(main); break;
                case 'withdraw': renderWithdraw(main); break;
                case 'transfer': renderTransfer(main); break;
                case 'orders': renderOrders(main); break;
                case 'receipt': renderReceipt(main, params.orderId); break;
                case 'resell': renderResell(main); break;
                case 'resell-add': renderResellForm(main); break;
                case 'wishlist': renderWishlist(main); break;
            }
        }

        // ===== HOME =====
        async function renderHome(container) {
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';

            const [bannersRes, popularRes, categoriesRes, resellRes] = await Promise.all([
                fetch(`${API_URL}/products/banners`),
                fetch(`${API_URL}/products?sort=popular&limit=10`),
                fetch(`${API_URL}/products/categories/all`),
                fetch(`${API_URL}/resell/listings`)
            ]);

            const bannersPayload = await bannersRes.json().catch(() => []);
            const banners = Array.isArray(bannersPayload) ? bannersPayload : [];
            const popular = await popularRes.json().catch(() => []);
            const categories = await categoriesRes.json().catch(() => []);
            const resellListings = await resellRes.json().catch(() => []);

            container.innerHTML = `
                <div class="home-page">
                    <div class="banner-slider">
                        ${banners.map(b => `
                            <div class="banner-slide" ${b.target_link ? `onclick="window.open('${escapeChatText(b.target_link)}', '_blank', 'noopener,noreferrer')"` : ''}>
                                <img src="${b.image_url}" alt="${b.title}">
                                <div class="banner-text">
                                    <h3>${b.title}</h3>
                                    <p>${b.subtitle}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="section-header">
                        <h3>Most Viewed</h3>
                        <button onclick="navigateTo('search', {sort: 'popular'})" class="link-btn">See All</button>
                    </div>
                    <div class="product-grid">
                        ${popular.map(p => renderProductCard(p)).join('')}
                    </div>

                    ${Array.isArray(resellListings) && resellListings.length ? `<div class="section-header"><h3>Resell Books</h3><button onclick="navigateTo('resell')" class="link-btn">See All</button></div><div class="product-grid">${resellListings.slice(0, 10).map(renderResellCard).join('')}</div>` : ''}

                    <div class="section-header">
                        <h3>Browse Categories</h3>
                    </div>
                    <div class="category-grid">
                        ${categories.map(c => `
                            <div class="category-card" onclick="navigateTo('search', {category: '${c.slug}'})">
                                <div class="category-icon"><i class="fas fa-book"></i></div>
                                <span>${c.name}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            initBannerSlider();
        }

        function renderResellCard(l) {
            let image = '/assets/logo.png'; try { image = JSON.parse(l.condition_images || '[]')[0] || image; } catch (_) {}
            const price = Number(l.final_price || l.asking_price || 0);
            return `<div class="product-card resell-product-card"><div class="product-image"><span class="resell-badge">RESELL</span><img src="${escapeChatText(image)}" alt="${escapeChatText(l.title || 'Resell book')}"></div><div class="product-info"><h4 class="product-title">${escapeChatText(l.title || 'Resell book')}</h4><p class="product-author">${escapeChatText(l.author_name || '')}</p><div class="product-price-row"><span class="price">${price.toLocaleString()} Ks</span></div><div class="product-meta"><span>Stock: ${Number(l.stock_quantity || 0)}</span><span>${escapeChatText(l.seller_name || 'User seller')}</span></div><button class="btn-primary resell-buy-btn" onclick="event.stopPropagation(); buyResell(${Number(l.listing_id)})">Buy</button></div></div>`;
        }

        function renderProductCard(p) {
            const storeOpen = p.store_is_open !== 0 && p.store_accepting_orders !== 0;
            const preorderClosed = p.sale_type === 'preorder' && p.preorder_end_at && new Date(p.preorder_end_at) <= new Date();
            const preorderUpcoming = p.sale_type === 'preorder' && p.preorder_start_at && new Date(p.preorder_start_at) > new Date();
            const saleLabel = p.sale_type === 'preorder' ? (preorderClosed ? 'PREORDER CLOSED' : preorderUpcoming ? 'PREORDER UPCOMING' : 'PREORDER') : p.sale_type === 'cod' ? 'COD' : 'PREPAID';
            return `
                    <div class="product-card" onclick="openProductDetail(${p.book_id})">
                    <button class="product-wishlist-btn" type="button" aria-label="Add to wishlist" onclick="event.stopPropagation(); toggleWishlist(${Number(p.book_id)}, this)"><i class="far fa-heart"></i></button><div class="product-image">${p.sale_type ? `<span class="sale-type-badge ${preorderClosed ? 'closed' : ''}">${saleLabel}</span>` : ''}
                        <img src="${p.images ? JSON.parse(p.images)[0] : '/assets/logo.png'}" alt="${p.title}">
                    </div>
                    <div class="product-info">
                        <h4 class="product-title">${p.title}</h4>
                        <p class="product-author">${p.author_name || ''}</p>
                        <div class="product-price-row">
                            <span class="price">${p.discounted_price || p.original_price} Ks</span>
                            ${p.discounted_price ? `<span class="original-price">${p.original_price} Ks</span>` : ''}
                        </div>
                        <div class="product-meta">
                            <span><i class="fas fa-eye"></i> ${p.view_count}</span>
                            <button class="store-link" onclick="event.stopPropagation(); navigateTo('shop', {sellerId: '${p.seller_id || ''}'})"><i class="fas fa-store"></i> ${escapeChatText(p.store_name || 'SPZ')}</button>
                        </div>
                        <div class="store-status-line ${storeOpen ? 'is-open' : 'is-closed'}"><i class="fas fa-circle"></i> ${storeOpen ? 'Open for orders' : 'ဆိုင်ခေတ္တပိတ်ထားသည်'}</div><small class="shipping-estimate-line">ပို့ခခန့်မှန်း: ${Number(p.free_shipping) ? 'အခမဲ့' : `${Number(p.estimated_shipping_fee || 0).toLocaleString()} Ks`} · ${escapeChatText(p.estimated_delivery_time || 'ကြာချိန်မသတ်မှတ်ရသေး')}</small>
                    </div>
                </div>
            `;
        }

        // ===== PRODUCT DETAIL =====
        async function openProductDetail(bookId) {
            const modal = document.getElementById('product-modal');
            const content = document.getElementById('product-detail-content');
            content.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i></div>';
            modal.classList.remove('hidden');

            const res = await fetch(`${API_URL}/products/${bookId}`);
            const p = await res.json();
            let reviewEligibility = { can_review: false, order_id: null };
            if (authToken) {
                const eligibilityRes = await fetch(`${API_URL}/orders/buyer/review-eligibility/${Number(bookId)}`, { headers: { 'Authorization': `Bearer ${authToken}` } });
                reviewEligibility = await eligibilityRes.json().catch(() => reviewEligibility);
            }

            const images = p.images ? JSON.parse(p.images) : [];
            const variations = p.variations || [];
            const storeOpen = p.store_is_open !== 0 && p.store_accepting_orders !== 0;
            const preorderClosed = p.sale_type === 'preorder' && p.preorder_end_at && new Date(p.preorder_end_at) <= new Date();
            const preorderUpcoming = p.sale_type === 'preorder' && p.preorder_start_at && new Date(p.preorder_start_at) > new Date();
            const saleLabel = p.sale_type === 'preorder' ? (preorderClosed ? 'PREORDER CLOSED' : preorderUpcoming ? 'PREORDER UPCOMING' : 'PREORDER') : p.sale_type === 'cod' ? 'CASH ON DELIVERY (COD)' : 'PREPAID';

            content.innerHTML = `
                <div class="product-detail">
                    <div class="image-gallery">
                        <div class="main-image">
                            <img id="main-product-img" src="${images[0] || '/assets/logo.png'}" alt="${p.title}">
                        </div>
                        <div class="thumbnail-row">
                            ${images.map((img, i) => `
                                <img src="${img}" onclick="document.getElementById('main-product-img').src='${img}'" class="${i===0?'active':''}">
                            `).join('')}
                        </div>
                    </div>

                    <div class="detail-info">
                        <h2>${p.title}</h2><span class="detail-sale-badge ${preorderClosed ? 'closed' : ''}">${saleLabel}</span>
                        <p class="author">${p.author_name || 'Unknown Author'}</p>
                        <div class="price-block">
                            <span class="current-price">${p.discounted_price || p.original_price} Ks</span>
                            ${p.discounted_price ? `<span class="original-price">${p.original_price} Ks</span>` : ''}
                        </div>
                        <div class="shop-response-card ${storeOpen ? 'is-open' : 'is-closed'}"><i class="fas fa-${storeOpen ? 'clock' : 'store-slash'}"></i><div><strong>${storeOpen ? (p.reply_time_text || 'Usually replies within 1 hour') : 'ဆိုင်ခေတ္တပိတ်ထားပါတယ်'}</strong><small>${storeOpen ? 'ဆိုင်ဖွင့်နေပြီး အော်ဒါလက်ခံနေပါတယ်' : (p.closed_message || 'ပြန်ဖွင့်ချိန်တွင် အော်ဒါလက်ခံပါမယ်')}</small></div></div>

                        <div class="variation-selector">
                            <label>အမျိုးအစားများ</label>
                            <select id="variation-select" onchange="updateVariationPrice(this)">
                                ${variations.map(v => `<option value="${v.variation_id}" data-price="${v.price}" data-stock="${v.stock_quantity}">${v.variation_name}</option>`).join('')}
                                ${variations.length === 0 ? `<option value="0" data-price="${p.discounted_price || p.original_price}" data-stock="${p.stock_quantity}">Standard</option>` : ''}
                            </select>
                        </div>

                        <div class="detail-meta">
                            <span><i class="fas fa-file-alt"></i> ${p.page_count || 'N/A'} pages</span>
                            <span><i class="fas fa-ruler"></i> ${p.size || 'N/A'}</span>
                            <span><i class="fas fa-boxes"></i> Stock: <span id="stock-display">${p.stock_quantity}</span></span>
                        </div>

        function escapeChatText(value) {
            return String(value || '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[ch]));
        }

        async function loadConversations(type) {
            const res = await fetch(`${API_URL}/chat/conversations`, {
                headers: { 'Authorization': `Bearer ${authToken}` }
            });
            const convs = await res.json();
            if (!res.ok || !Array.isArray(convs)) throw new Error(convs.error || 'Unable to load conversations');
            const filtered = type === 'all' ? convs : convs.filter(c => c.conversation_type === type);

            document.getElementById('conversation-list').innerHTML = filtered.map(c => `
                <div class="conversation-item" onclick="openChat(${c.conversation_id})">
                    <div class="conv-avatar">${c.peer_profile?.image ? `<img src="${escapeChatText(c.peer_profile.image)}" alt="">` : `<i class="fas fa-${c.peer_profile?.type === 'seller' ? 'store' : 'user-circle'}"></i>`}</div>
                    <div class="conv-info">
                        <h4>${escapeChatText(c.peer_profile?.display_name || `Conversation #${c.conversation_id}`)}</h4>
                        <small>${c.peer_profile?.type === 'seller' ? 'ဆိုင်' : 'ဝယ်သူ'}${c.peer_profile?.public_id ? ` · ${escapeChatText(c.peer_profile.public_id)}` : ''}</small>
                        <p class="conv-preview">${escapeChatText(c.last_message || 'No messages yet')}</p>
                        <span class="conv-time">${c.last_message_time ? new Date(c.last_message_time).toLocaleDateString() : ''}</span>
                    </div>
                    <button class="chat-delete-btn" aria-label="Delete chat" onclick="event.stopPropagation(); deleteChat(${c.conversation_id})"><i class="fas fa-trash-alt"></i></button>
                </div>
            `).join('') || '<p class="empty-text">No conversations yet</p>';
        }

        async function openChat(conversationId) {
            const main = document.getElementById('main-content');
            main.innerHTML = `<div class="chat-page"><button class="btn-text" onclick="navigateTo('chat')"><i class="fas fa-arrow-left"></i> Back to messages</button><h2 id="chat-peer-title">Conversation #${conversationId}</h2><div id="message-list" class="message-list"><p class="loading">Loading messages...</p></div><form class="chat-compose" onsubmit="sendChatMessage(event, ${conversationId})"><input id="chat-message-input" required maxlength="2000" placeholder="Write a message..."><button class="btn-primary" type="submit"><i class="fas fa-paper-plane"></i> Send</button></form></div>`;
            try {
                const res = await fetch(`${API_URL}/chat/${conversationId}`, { headers: { 'Authorization': `Bearer ${authToken}` } });
                const messages = await res.json();
                if (!res.ok) throw new Error(messages.error || 'Unable to load messages');
                if (!Array.isArray(messages)) throw new Error('Unable to load messages');
                const peer = messages.find(m => String(m.sender_id) !== myId && m.sender_name)?.sender_name;
                if (peer) document.getElementById('chat-peer-title').textContent = peer;
                const myId = `U${currentUser.user_id || currentUser.id}`;
                document.getElementById('message-list').innerHTML = messages.map(m => `<div class="message-bubble ${String(m.sender_id) === myId ? 'mine' : 'theirs'}"><div>${m.message_type === 'image' ? `<img src="${escapeChatText(m.content)}" alt="Chat image">` : escapeChatText(m.content)}</div><small>${m.sender_public_id ? `<button class="chat-user-link" onclick="navigateTo('user', {publicId: '${escapeChatText(m.sender_public_id)}'})">${escapeChatText(m.sender_name || 'View profile')}</button>` : escapeChatText(m.sender_name || '')} · ${m.created_at ? new Date(m.created_at).toLocaleString() : ''}</small></div>`).join('') || '<p class="empty-text">No messages yet</p>';
            } catch (err) { document.getElementById('message-list').innerHTML = `<p class="error-text">${escapeChatText(err.message)}</p>`; }
        }

        async function sendChatMessage(event, conversationId) {
            event.preventDefault();
            const input = document.getElementById('chat-message-input');
            const content = String(input.value || '').trim(); if (!content) return;
            input.disabled = true;
            const res = await fetch(`${API_URL}/chat`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` }, body: JSON.stringify({ conversation_id: conversationId, content }) });
            const data = await res.json();
            input.disabled = false;
            if (!res.ok) return alert(data.error || 'Unable to send message');
            openChat(conversationId);
        }

        async function deleteChat(conversationId) {
            if (!confirm('ဒီ chat ကို သင့် chat list မှ ဖျက်မလား?')) return;
            const res = await fetch(`${API_URL}/chat/conversations/${conversationId}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${authToken}` } });
            const data = await res.json();
            if (!res.ok) return alert(data.error || 'Unable to delete chat');
            loadConversations('all');
        }

        async function renderReceipt(container, orderId) {
            if (!authToken || !orderId) { container.innerHTML = '<p class="error-text">Receipt is unavailable.</p>'; return; }
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Preparing receipt...</div>';
            try {
                const res = await fetch(`${API_URL}/orders/buyer/${Number(orderId)}/receipt`, { headers: { 'Authorization': `Bearer ${authToken}` } });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Receipt is not available yet');
                currentReceiptData = data;
                const receipt = data.receipt;

        function renderCartItems() {
            const container = document.getElementById('cart-items');
            if (!container) return;

            const groups = cart.reduce((map, item, index) => {
                const key = item.seller_id || `unknown-${index}`;
                if (!map[key]) map[key] = { seller_id: key, store_name: item.store_name || 'စာပေဇုန်ဆိုင်', items: [] };
                map[key].items.push({ ...item, index });
                return map;
            }, {});
            let total = 0;
            container.innerHTML = Object.values(groups).map(group => {
                const shopTotal = group.items.reduce((sum, item) => sum + item.price * item.qty, 0);
                total += shopTotal;
                return `
                    <section class="cart-shop-group">
                        <div class="cart-shop-heading"><span><i class="fas fa-store"></i> ${group.store_name}</span><small>${group.items.length} မျိုး</small></div>
                        ${group.items.map(item => `
                            <div class="cart-item">
                                <img src="${item.image}" alt="${item.title}">
                                <div class="cart-item-info">
                                    <h4>${item.title}</h4>
                                    <p class="cart-item-price">${item.price.toLocaleString()} Ks</p>
                                    <div class="quantity-control">
                                        <button onclick="changeCartQty(${item.index}, -1)" aria-label="Decrease quantity">−</button>
                                        <strong>${item.qty}</strong>
                                        <button onclick="changeCartQty(${item.index}, 1)" aria-label="Increase quantity">+</button>
                                    </div>
                                </div>
                                <div class="cart-item-end"><strong>${(item.price * item.qty).toLocaleString()} Ks</strong><button onclick="removeFromCart(${item.index})" class="btn-icon danger" aria-label="Remove item"><i class="fas fa-trash"></i></button></div>
                            </div>
                        `).join('')}
                        <div class="cart-shop-shipping"><i class="fas fa-route"></i> ဒီဆိုင်အတွက် ပို့ခတစ်ကြိမ် — checkout တွင် မြို့နယ်အလိုက်တွက်ပါမယ်</div>
                    </section>
                `;
            }).join('') || '<p class="empty-text">Your cart is empty</p>';

            const totalEl = document.getElementById('cart-total');
            if (totalEl) totalEl.textContent = total.toLocaleString();
        }

        function changeCartQty(index, delta) {
            if (!cart[index]) return;
            cart[index].qty = Math.max(1, cart[index].qty + delta);
            localStorage.setItem('spz_cart', JSON.stringify(cart));
            renderCartItems();
        }

        async function addToCart(bookId) {
            try {
                const res = await fetch(`${API_URL}/products/${bookId}`);
                const p = await res.json();
                if (!res.ok) throw new Error(p.error || 'Unable to load product');
                const images = p.images ? JSON.parse(p.images) : [];
                const price = Number(p.discounted_price || p.original_price || 0);
                const existing = cart.find(item => item.book_id === bookId);
                if (existing) existing.qty += 1;
                else cart.push({ book_id: bookId, title: p.title, price, qty: 1, image: images[0] || '/assets/logo.png', seller_id: p.seller_id, store_name: p.store_name || 'စာပေဇုန်ဆိုင်', sale_type: p.sale_type || 'prepaid', preorder_deposit_amount: Number(p.preorder_deposit_amount || 0), cod_deposit_amount: Number(p.cod_deposit_amount || 0), estimated_shipping_fee: Number(p.estimated_shipping_fee || 0), free_shipping: Number(p.free_shipping) ? 1 : 0, estimated_delivery_time: p.estimated_delivery_time || '' });
                localStorage.setItem('spz_cart', JSON.stringify(cart));
                alert('Added to cart');
            } catch (err) {
                alert(err.message || 'Unable to add this book to cart');
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);

        async function submitCheckout() {
            const shipping_address = document.getElementById('checkout-address').value.trim();
            const payment_method = document.getElementById('checkout-payment').value;
            const errorBox = document.getElementById('checkout-error');
            if (!shipping_address) {
                errorBox.textContent = 'လက်ခံမည့်အသေးစိတ်လိပ်စာနှင့် ဆက်သွယ်ရန်ဖုန်းနံပါတ်ကို ဖြည့်ပါ'; return;
            }
            const submitButton = document.querySelector('#checkout-modal .btn-primary');
            submitButton.disabled = true;
            const res = await fetch(`${API_URL}/orders/bulk`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                body: JSON.stringify({ items: cart.map(item => ({ product_id: Number(item.book_id), quantity: Number(item.qty) || 1, variation_id: item.variation_id == null ? null : Number(item.variation_id) })), shipping_address, shipping_state: null, shipping_district: null, shipping_township: null, p2p_friend_id: null, payment_method })
            });
            const data = await res.json();
            submitButton.disabled = false;
            if (!res.ok) { errorBox.textContent = data.error || 'အော်ဒါတင်၍ မရပါ'; return; }
            closeCheckoutModal();
            const amountPaid = Number(data.amount_paid ?? data.total ?? 0);
            const remaining = Number(data.remaining_due_on_delivery ?? Math.max(0, Number(data.merchandise_total || 0) - amountPaid));
            const paymentSummary = payment_method === 'cod'
                ? `အခု ပေးရမည့် COD စရံ ${amountPaid.toLocaleString()} Ks\nပစ္စည်းရောက်မှ ပေးရမည့်ကျန်ငွေ ${remaining.toLocaleString()} Ks`
                : `အခု ပေးချေငွေ ${amountPaid.toLocaleString()} Ks`;

            navigateTo('orders');
        }

            container.innerHTML = `<div class="transfer-page"><button class="btn-text" onclick="navigateTo('wallet')"><i class="fas fa-arrow-left"></i> Back to wallet</button><div class="page-heading"><p class="eyebrow">Wallet</p><h2>Transfer to another user</h2><p class="text-secondary">ID ကို အရင်ရှာပြီး အမည်/အကောင့်ကို အတည်ပြုပြီးမှ ပမာဏထည့်ကာ လွှဲပါ။</p></div><div class="transfer-balance">Available balance: <strong>${Number(wallet.balance || 0).toLocaleString()} Ks</strong></div><form id="transfer-form" class="transfer-form"><div class="form-group"><label>Recipient Public ID *</label><div class="recipient-lookup-row"><input id="transfer-recipient" required placeholder="ဥပမာ U#000001"><button type="button" class="btn-secondary" id="verify-recipient-btn">ရှာမည်</button></div><div id="recipient-preview" class="recipient-preview hidden"></div></div><div class="form-group"><label>Amount (Ks) *</label><input id="transfer-amount" type="number" min="1" max="150000" step="1" required placeholder="10000" disabled><small>Daily limit: 150,000 Ks · Transfer fee: 3%</small></div><div class="form-group"><label>Note</label><textarea id="transfer-note" rows="3" maxlength="200" placeholder="မှတ်ချက် (optional)" disabled></textarea></div><p id="transfer-error" class="error-text"></p><button class="btn-primary" type="submit" disabled>Review Transfer</button></form></div>`;
            document.getElementById('transfer-form').addEventListener('submit', submitTransfer);
            document.getElementById('verify-recipient-btn').addEventListener('click', verifyTransferRecipient);
        }
        let verifiedTransferRecipient = null;
        async function verifyTransferRecipient() {
            const input = document.getElementById('transfer-recipient'); const preview = document.getElementById('recipient-preview'); const button = document.getElementById('verify-recipient-btn');
            const publicId = input.value.trim(); verifiedTransferRecipient = null; preview.classList.add('hidden'); document.getElementById('transfer-amount').disabled = true; document.getElementById('transfer-note').disabled = true; document.querySelector('#transfer-form button[type="submit"]').disabled = true;
            if (!publicId) return;
            button.disabled = true;
            try { const res = await fetch(`${API_URL}/wallet/p2p/recipient/${encodeURIComponent(publicId)}`, { headers: { 'Authorization': `Bearer ${authToken}` } }); const data = await res.json(); if (!res.ok) throw new Error(data.error || 'Recipient not found'); verifiedTransferRecipient = data.recipient; preview.innerHTML = `<strong>${escapeChatText(data.recipient.name || 'အမည်မဖော်ပြထားပါ')}</strong><span>${escapeChatText(data.recipient.public_id)}</span><small>${escapeChatText(data.recipient.phone || '')}</small><label><input id="recipient-confirm" type="checkbox"> ဤအကောင့်သည် မှန်ကန်ကြောင်း အတည်ပြုပါ</label>`; preview.classList.remove('hidden'); document.getElementById('recipient-confirm').addEventListener('change', e => { const enabled = e.target.checked; document.getElementById('transfer-amount').disabled = !enabled; document.getElementById('transfer-note').disabled = !enabled; document.querySelector('#transfer-form button[type="submit"]').disabled = !enabled; }); } catch (err) { document.getElementById('transfer-error').textContent = err.message; } finally { button.disabled = false; }
        }

        async function submitTransfer(event) {
            event.preventDefault();
            const recipient = document.getElementById('transfer-recipient').value.trim();
            const amount = Number(document.getElementById('transfer-amount').value);
            const note = document.getElementById('transfer-note').value.trim();
            const error = document.getElementById('transfer-error');
            if (!verifiedTransferRecipient || verifiedTransferRecipient.public_id !== recipient || !Number.isFinite(amount) || amount <= 0 || amount > 150000) { error.textContent = 'လက်ခံသူအကောင့်ကို ရှာဖွေပြီး အတည်ပြုပြီးမှ ပမာဏထည့်ပါ။'; return; }
            const fee = amount * 0.03; const total = amount + fee;
            if (!confirm(`Step 1 of 2 — Review\n\nRecipient: ${recipient}\nSend amount: ${amount.toLocaleString()} Ks\nFee (3%): ${fee.toLocaleString()} Ks\nTotal deducted: ${total.toLocaleString()} Ks\n\nContinue to final confirmation?`)) return;
            if (!confirm(`Step 2 of 2 — Final confirmation\n\nYou are about to transfer ${amount.toLocaleString()} Ks to ${recipient}.\nThis action cannot be reversed after completion.\n\nConfirm and send now?`)) return;
            const button = event.currentTarget.querySelector('button[type="submit"]'); button.disabled = true; error.textContent = '';
            try {
                const res = await fetch(`${API_URL}/wallet/p2p`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` }, body: JSON.stringify({ recipient_public_id: recipient, amount, note }) });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Transfer failed');
                showWalletReceipt({ type: 'P2P ငွေလွှဲခြင်း', amount, recipient, reference: data.transaction_id || data.reference_id || '', fee: data.fee || amount * 0.03, note, status: 'ငွေလွှဲခြင်း အောင်မြင်ပါသည်' });
                navigateTo('wallet');
            } catch (err) { error.textContent = err.message; button.disabled = false; }
        }

        function showResellForm() { navigateTo('resell-add'); }

        async function startChat(sellerId, bookId) {
            if (!currentUser) { showAuthModal(); return; }
            const numericSellerId = Number(sellerId);
            if (!Number.isSafeInteger(numericSellerId) || numericSellerId <= 0) { alert('Shop contact is unavailable for this product.'); return; }
            try {
                const res = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                    body: JSON.stringify({ conversation_type: 'buyer_shop', participants: [`U${Number(currentUser.user_id || currentUser.id)}`, `S${numericSellerId}`] })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Unable to start chat');
                closeModal('product-modal');
                navigateTo('chat');
                openChat(Number(data.conversation_id));
            } catch (err) {
                alert(err.message || 'Unable to start chat');
            }
        }
        async function shareProduct(publicId) {
            const url = `${location.origin}${location.pathname}?product=${encodeURIComponent(publicId)}`;
            const shareData = { title: 'Sar Pay Zone Book', text: 'View this book on Sar Pay Zone', url };
            try { if (navigator.share) { await navigator.share(shareData); return; } } catch (err) { if (err.name === 'AbortError') return; }
            try { await navigator.clipboard.writeText(url); alert('Product link copied'); } catch (_) { prompt('Copy this product link', url); }
        }
        function showShareOptions(publicId, button) {
            document.querySelectorAll('.share-options').forEach(el => el.remove());
            const url = `${location.origin}${location.pathname}?product=${encodeURIComponent(publicId)}`;
            const encodedId = encodeURIComponent(String(publicId));
            const menu = document.createElement('div'); menu.className = 'share-options';
            menu.innerHTML = `<button onclick="window.open('https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}','_blank','noopener,noreferrer')"><i class="fab fa-facebook"></i> Facebook</button><button onclick="window.open('https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent('Sar Pay Zone Book')}','_blank','noopener,noreferrer')"><i class="fab fa-telegram"></i> Telegram</button><button onclick="window.open('https://wa.me/?text=${encodeURIComponent(`Sar Pay Zone Book: ${url}`)}','_blank','noopener,noreferrer')"><i class="fab fa-whatsapp"></i> WhatsApp</button><button onclick="shareProduct(decodeURIComponent('${encodedId}'))"><i class="fas fa-link"></i> Copy link</button>`;
            button.parentElement.appendChild(menu);
        }
        function openReviewForm(orderId) {
            const rating = Number(prompt('Rating from 1 to 5', '5'));
            const comment = prompt('Review comment') || '';
            if (!rating) return;
            fetch(`${API_URL}/orders/${orderId}/review`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                body: JSON.stringify({ rating, comment })
            }).then(r => r.json().then(data => alert(r.ok ? 'Review submitted' : (data.error || 'Review failed'))));
        }

        // ===== UTILITIES =====
        function logout() {
            localStorage.removeItem('spz_token');
            authToken = null;
            currentUser = null;
            location.reload();
        }

        function toggleNightMode() {
            document.body.classList.toggle('night-mode');
            localStorage.setItem('spz_night', document.body.classList.contains('night-mode'));
        }

        function initBannerSlider() {
            // Simple auto-slide
            const slides = document.querySelectorAll('.banner-slide');
            let current = 0;
            slides.forEach((s, i) => s.style.display = i === 0 ? 'block' : 'none');
            if (slides.length <= 1) return;

            setInterval(() => {
                slides.forEach((s, i) => s.style.display = i === current ? 'block' : 'none');
                current = (current + 1) % slides.length;
            }, 5000);
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        async function requestPushPermission() {
            if ('serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && Notification.permission !== 'denied') {
                try {
                    if (Notification.permission === 'default') await Notification.requestPermission();
                    if (Notification.permission !== 'granted') return;
                    const reg = await navigator.serviceWorker.register('/service-worker.js');
                    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array('BB4adKD_jrSODVxxlh9R4-OOm0Bu8NIAfv507H6ZC0_12nvjVyQO0yjkRwIJnzUHhuQ8YV9W6ZLhdZNVS2dsmx0') });
                    await fetch(`${API_URL}/push/subscribe`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${authToken}`
                        },
                        body: JSON.stringify({
                            endpoint: sub.endpoint,
                            keys: { p256dh: btoa(String.fromCharCode(...new Uint8Array(sub.getKey('p256dh')))), auth: btoa(String.fromCharCode(...new Uint8Array(sub.getKey('auth')))) }
                        })
                    });
                } catch (err) {
                    console.log('Push notification permission denied');
                }
            }
        }

        // Init
        if (localStorage.getItem('spz_night') === 'true') document.body.classList.add('night-mode');

        // Check if returning from shared link
        const urlParams = new URLSearchParams(window.location.search);
        const sharedProduct = urlParams.get('product');
        if (sharedProduct) {
            // Would redirect to product after login
            localStorage.setItem('spz_redirect', sharedProduct);
        }
    </script>
