<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Dashboard - Sar Pay Zone</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .store-header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 24px 16px; margin: -16px -16px 16px; border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
        .store-header h2, .store-header h3 { color: white; }
        .store-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
        .store-tab { flex: 1; padding: 12px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-secondary); font-weight: 600; cursor: pointer; }
        .store-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .order-filter-bar { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; }
        .metric-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .metric-card { background: var(--card); border: 1px solid var(--border); padding: 16px; border-radius: var(--radius); text-align: center; }
        .metric-value { font-size: 24px; font-weight: 700; font-family: var(--font-mono); color: var(--primary); }
        .metric-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
        .seller-product-list { display: grid; gap: 14px; }
        .seller-product-card { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 16px; align-items: stretch; padding: 14px; border: 1px solid rgba(45,125,79,.18); border-radius: 18px; background: linear-gradient(135deg, #8ee2d8 0%, #72d5c9 100%); box-shadow: 7px 8px 0 rgba(20, 42, 36, .12), 0 10px 22px rgba(20, 42, 36, .08); color: #102f2d; }
        .seller-product-cover { width: 86px; height: 112px; align-self: center; overflow: hidden; border: 1px solid rgba(255,255,255,.8); border-radius: 4px; background: #f9f9f7; box-shadow: 0 2px 6px rgba(20,42,36,.1); }
        .seller-product-cover img { width: 100%; height: 100%; display: block; object-fit: cover; }
        .seller-product-cover.is-empty { display: grid; place-items: center; padding: 8px; color: #7d8581; text-align: center; font-size: 12px; font-weight: 700; }
        .seller-product-content { min-width: 0; display: flex; flex-direction: column; }
        .seller-product-id { align-self: flex-start; margin: -2px 0 8px; padding: 3px 9px; background: #13b7a5; color: #073a36; font-family: var(--font-mono); font-size: 12px; font-weight: 800; letter-spacing: .02em; }
        .seller-product-title { margin: 0; overflow: hidden; color: #102f2d; font-size: 17px; line-height: 1.3; text-overflow: ellipsis; white-space: nowrap; }
        .seller-product-author { margin: 4px 0 0; overflow: hidden; color: #173f3b; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
        .seller-product-divider { height: 1px; margin: 12px 0 9px; background: rgba(16,47,45,.75); }
        .seller-product-meta { display: flex; justify-content: space-between; gap: 12px; color: #102f2d; font-size: 14px; }
        .seller-product-meta strong { font-weight: 800; }
        .seller-product-status { margin-left: 6px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .seller-product-status.is-inactive { color: #8a3027; }
        .seller-product-actions { display: flex; justify-content: flex-end; gap: 22px; margin-top: auto; padding-top: 10px; }
        .seller-product-actions button { border: 0; background: transparent; color: #165c3a; font-family: var(--font-sans); font-size: 15px; font-weight: 800; cursor: pointer; }
        .seller-product-actions button:hover { color: #073a36; text-decoration: underline; }
        .seller-product-edit-form { padding: 18px; border: 1px solid var(--border); border-radius: 18px; background: var(--card); box-shadow: var(--shadow); }
        .seller-product-edit-form h3 { margin: 0 0 16px; }
        @media (max-width: 420px) { .seller-product-card { grid-template-columns: 72px minmax(0, 1fr); gap: 11px; padding: 11px; } .seller-product-cover { width: 72px; height: 96px; } .seller-product-title { font-size: 15px; } .seller-product-meta { font-size: 12px; } .seller-product-actions { gap: 13px; } }
        .product-form { display: flex; flex-direction: column; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 14px; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea { padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; background: var(--bg); color: var(--text); }
        .image-upload-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 40px; text-align: center; cursor: pointer; }
        .shipping-tree { margin-left: 16px; border-left: 2px solid var(--border); padding-left: 16px; }
        .shipping-node { margin-bottom: 12px; }
        .shipping-node-header { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; }
        .commission-display { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: var(--radius); margin-bottom: 16px; }
        .commission-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-family: var(--font-mono); }
        .settings-section { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: var(--radius); margin-bottom: 16px; }
        .settings-section h3 { margin-bottom: 12px; }
        .small { font-size: 12px; }
        .text-secondary { color: var(--text-secondary); }
        .btn-text.success { color: var(--success); }
        .btn-text.danger { color: var(--danger); }
        .btn-text { background: none; border: none; cursor: pointer; font-size: 13px; font-weight: 600; }
        .status-new { background: hsl(210, 60%, 92%); color: hsl(212, 70%, 38%); }
        .status-approved { background: hsl(38, 85%, 92%); color: hsl(30, 75%, 38%); }
        .status-shipping { background: hsl(154, 40%, 90%); color: hsl(154, 40%, 30%); }
        .status-delivered { background: hsl(154, 40%, 90%); color: hsl(154, 45%, 24%); }
        .status-cancelled { background: hsl(3, 55%, 93%); color: hsl(3, 60%, 40%); }
        .order-status { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; font-family: var(--font-mono); text-transform: uppercase; }
        .order-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .order-number { font-weight: 600; font-size: 14px; }
        .order-body { display: flex; gap: 12px; }
        .order-body img { width: 60px; height: 80px; object-fit: cover; border-radius: var(--radius-sm); }
        .order-info { flex: 1; }
        .order-info h4 { font-size: 14px; margin-bottom: 4px; }
        .order-info p { font-size: 13px; color: var(--text-secondary); margin: 2px 0; }
        .order-actions { display: flex; gap: 16px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
        .order-actions .btn-text { font-size: 13px; }
        .image-preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-top: 8px; }
        .image-preview-grid img { width: 100%; height: 80px; object-fit: cover; border-radius: var(--radius-sm); border: 2px solid var(--border); }
        .store-shell { min-height: 100vh; }
        .menu-toggle { display:flex; align-items:center; gap:8px; }
        .store-drawer-backdrop { position:fixed; inset:0; background:rgba(20,30,24,.4); z-index:500; opacity:0; pointer-events:none; transition:opacity .2s; }
        .store-drawer { position:fixed; top:0; bottom:0; left:0; width:min(310px,86vw); background:var(--card); z-index:501; transform:translateX(-102%); transition:transform .22s ease-out; padding:20px 14px; overflow:auto; box-shadow:var(--shadow-lg); }
        .store-drawer.open { transform:translateX(0); }
        .store-drawer-backdrop.open { opacity:1; pointer-events:auto; }
        .drawer-brand { padding:10px 12px 20px; border-bottom:1px solid var(--border); margin-bottom:10px; }
        .drawer-nav { display:grid; gap:4px; }
        .drawer-nav button { width:100%; border:0; background:transparent; color:var(--text); padding:13px 12px; text-align:left; border-radius:10px; font:600 14px var(--font-sans); display:flex; gap:12px; align-items:center; cursor:pointer; }
        .drawer-nav button:hover,.drawer-nav button.active { background:var(--surface); color:var(--primary); }
        .drawer-footer { border-top:1px solid var(--border); margin-top:18px; padding-top:14px; display:grid; gap:10px; }
        .language-switch { display:flex; gap:6px; }
        .language-switch button { flex:1; padding:9px; border:1px solid var(--border); background:var(--surface); border-radius:8px; cursor:pointer; color:var(--text); }
        .language-switch button.active { background:var(--primary); color:#fff; border-color:var(--primary); }
        .product-tab-panel { display:none; }
        .product-tab-panel.active { display:block; }
        .product-form-actions { display:flex; gap:10px; position:sticky; bottom:8px; background:var(--card); padding:10px 0; z-index:2; }
        .product-form-actions button { flex:1; }
        .store-subnav { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:14px 0; }
        .store-subnav button { padding:14px 10px; text-align:left; border:1px solid var(--border); border-radius:12px; background:var(--card); color:var(--text); cursor:pointer; }
        .store-subnav button.active { border-color:var(--primary); color:var(--primary); box-shadow:var(--shadow); }
        @media (min-width:800px) { .store-drawer { width:280px; } .main-content { margin-left:280px; } .menu-toggle { display:none; } .store-drawer { transform:none; } .store-drawer-backdrop { display:none; } }
        .settings-accordion { background:var(--card); border:1px solid var(--border); border-radius:14px; margin:12px 0; overflow:hidden; }
        .settings-accordion summary { cursor:pointer; list-style:none; padding:16px; font-weight:700; display:flex; justify-content:space-between; align-items:center; }
        .settings-accordion summary::-webkit-details-marker { display:none; }
        .settings-accordion summary::after { content:'+'; color:var(--primary); font-size:20px; }
        .settings-accordion[open] summary::after { content:'−'; }
        .settings-accordion .settings-section { border:0; border-top:1px solid var(--border); border-radius:0; margin:0; }
        .product-form-tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin-bottom:16px; background:var(--surface); border-radius:12px; padding:4px; position:sticky; top:56px; z-index:5; }
        .product-form-tabs .store-tab { border:0; border-radius:9px; padding:10px 4px; font-size:12px; }
        .product-form-tabs .store-tab.active { background:var(--card); box-shadow:var(--shadow); }
        .store-profile-form { min-height:640px; }
        .store-profile-form > button[type="submit"] { margin-top:auto; }
        .sales-bar-chart { min-height:180px; display:flex; align-items:end; gap:8px; overflow-x:auto; padding:16px 4px 28px; border-bottom:1px solid var(--border); }
        .sales-bar { min-width:42px; max-width:64px; position:relative; border:0; border-radius:7px 7px 0 0; background:var(--primary); color:#fff; cursor:pointer; padding:3px; transition:filter .15s; }
        .sales-bar:hover { filter:brightness(1.18); }
        .sales-bar span { position:absolute; bottom:100%; left:50%; transform:translateX(-50%); color:var(--text); font-size:10px; white-space:nowrap; }
        .sales-bar small { position:absolute; top:100%; left:50%; transform:translateX(-50%) rotate(-35deg); transform-origin:top left; color:var(--text-secondary); white-space:nowrap; font-size:10px; }
        .analytics-date-filter { display:flex; gap:8px; align-items:end; flex-wrap:wrap; }
        .analytics-date-filter label { width:100%; font-weight:700; }
        .analytics-date-filter input { padding:10px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); }
        .a4-sales-report { background:#fff; color:#17231d; padding:24px; margin-top:18px; box-shadow:var(--shadow); }
        .a4-sales-report table { width:100%; border-collapse:collapse; margin:16px 0; font-size:12px; }
        .a4-sales-report th,.a4-sales-report td { border:1px solid #cbd5cf; padding:7px; text-align:left; }
        .a4-sales-report th { background:#eaf1eb; }
        .conv-avatar img { width:42px; height:42px; border-radius:50%; object-fit:cover; }
        .chat-delete-btn { margin-left:auto; border:0; background:transparent; color:var(--danger); cursor:pointer; padding:10px; }
        @media print { @page { size:A4 portrait; margin:12mm; } body * { visibility:hidden; } #a4-sales-report, #a4-sales-report * { visibility:visible; } #a4-sales-report { position:absolute; left:0; top:0; width:100%; box-shadow:none; } #a4-sales-report button { display:none; } }
    </style>
</head>
<body>
    <div id="store-app" class="store-shell">
        <header class="app-header">
            <button class="icon-btn menu-toggle" onclick="toggleStoreMenu()" aria-label="Open menu"><i class="fas fa-bars"></i><span data-i18n="nav.menu">Menu</span></button>
            <div class="logo-slot-header"><i class="fas fa-store"></i> <span data-i18n="app.store_portal">Store Portal</span></div>
            <button onclick="logout()" class="icon-btn"><i class="fas fa-sign-out-alt"></i></button>
        </header>

        <div id="store-drawer-backdrop" class="store-drawer-backdrop" onclick="toggleStoreMenu(false)"></div>
        <aside id="store-drawer" class="store-drawer" aria-label="Store navigation">
            <div class="drawer-brand"><strong>Sar Pay Zone</strong><p id="drawer-store-name" class="small text-secondary">Store Portal</p></div>
            <nav class="drawer-nav">
                <button onclick="navigateStore('dashboard');toggleStoreMenu(false)"><i class="fas fa-chart-line"></i><span data-i18n="nav.dashboard">ဒက်ရှ်ဘုတ်</span></button>
                <button onclick="navigateStore('orders');toggleStoreMenu(false)"><i class="fas fa-clipboard-list"></i><span data-i18n="nav.orders">အော်ဒါများ</span></button>
                <button onclick="navigateStore('products');toggleStoreMenu(false)"><i class="fas fa-book"></i><span data-i18n="nav.products">ပစ္စည်းများ</span></button>
                <button onclick="navigateStore('settings');toggleStoreMenu(false)"><i class="fas fa-cog"></i><span data-i18n="nav.settings">ဆက်တင်</span></button>
                <button onclick="navigateStore('store');toggleStoreMenu(false)"><i class="fas fa-shop"></i><span data-i18n="nav.store">ဆိုင်</span></button>
                <button onclick="navigateStore('wallet');toggleStoreMenu(false)"><i class="fas fa-wallet"></i><span data-i18n="nav.wallet">ဆိုင် Wallet</span></button>
                <button onclick="navigateStore('chat');toggleStoreMenu(false)"><i class="fas fa-comments"></i><span data-i18n="nav.messages">စာတိုများ</span></button>
            </nav>
            <div class="drawer-footer"><span class="small text-secondary" data-i18n="lang.select">ဘာသာစကား</span><div class="language-switch"><button id="lang-my" onclick="setStoreLanguage('my')">မြန်မာ</button><button id="lang-en" onclick="setStoreLanguage('en')">English</button></div><button class="btn-text danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span data-i18n="nav.logout">ထွက်မည်</span></button></div>
        </aside>

        <main id="store-content" class="main-content"></main>
    </div>

    <script>
        const API_URL = 'https://sarpayzone-production.up.railway.app/api';
        const SPZ_TRANSLATIONS = { my: { 'app.store_portal':'ဆိုင်ပေါ်တယ်','nav.menu':'မီနူး','nav.dashboard':'ဒက်ရှ်ဘုတ်','nav.orders':'အော်ဒါများ','nav.products':'ပစ္စည်းများ','nav.settings':'ဆက်တင်','nav.store':'ဆိုင်','nav.wallet':'ဆိုင် Wallet','nav.messages':'စာတိုများ','nav.logout':'ထွက်မည်','lang.select':'ဘာသာစကား','common.next':'ရှေ့သို့','common.back':'နောက်သို့','form.basic':'အခြေခံ','form.pricing':'ဈေးနှုန်း','form.images':'ပုံများ','form.options':'ရွေးချယ်စရာများ' }, en: { 'app.store_portal':'Store Portal','nav.menu':'Menu','nav.dashboard':'Dashboard','nav.orders':'Orders','nav.products':'Products','nav.settings':'Settings','nav.store':'Store','nav.wallet':'Store Wallet','nav.messages':'Messages','nav.logout':'Logout','lang.select':'Language','common.next':'Next','common.back':'Back','form.basic':'Basic','form.pricing':'Pricing','form.images':'Images','form.options':'Options' } };
        let storeLanguage = localStorage.getItem('spz_lang') || 'my';
        function t(key) { return SPZ_TRANSLATIONS[storeLanguage]?.[key] || SPZ_TRANSLATIONS.en[key] || key; }
        function setStoreLanguage(language) { storeLanguage = language === 'en' ? 'en' : 'my'; localStorage.setItem('spz_lang', storeLanguage); document.documentElement.lang = storeLanguage; document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); }); document.getElementById('lang-my')?.classList.toggle('active', storeLanguage === 'my'); document.getElementById('lang-en')?.classList.toggle('active', storeLanguage === 'en'); }
        function toggleStoreMenu(force) { const open = typeof force === 'boolean' ? force : !document.getElementById('store-drawer').classList.contains('open'); document.getElementById('store-drawer').classList.toggle('open', open); document.getElementById('store-drawer-backdrop').classList.toggle('open', open); }
        let storeToken = localStorage.getItem('spz_store_token');
        let storeUser = null;
        let storePasswordCode = null;
        let selectedImages = [];
        let variationDrafts = [];
        let sellerProductsCache = [];

        async function initStore() {
            if (!storeToken) { window.location.href = '/publisherlogin.html'; return; }
            try {
                const res = await fetch(`${API_URL}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${storeToken}` }
                });
                if (!res.ok) { logout(); return; }
                storeUser = (await res.json()).user;
                if (!['publisher', 'bookstore', 'commission_store'].includes(storeUser?.role)) { logout(); return; }
                document.getElementById('drawer-store-name').textContent = storeUser.store_name || storeUser.name || 'Store Portal';
                setStoreLanguage(storeLanguage);
                const codeRes = await fetch(`${API_URL}/auth/seller/store-code`, { headers: { 'Authorization': `Bearer ${storeToken}` } });
                if (codeRes.ok) storePasswordCode = await codeRes.json();
                requestStorePushPermission();
                navigateStore('dashboard');
            } catch (err) {
                console.error('Init error:', err);
                logout();
            }
        }

        function storeUrlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
            const rawData = atob((base64String + padding).replace(/-/g, '+').replace(/_/g, '/'));
            return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
        }

        async function requestStorePushPermission() {
            if (!('serviceWorker' in navigator) || !('PushManager' in window) || Notification.permission === 'denied') return;
            try {
                if (Notification.permission === 'default') await Notification.requestPermission();
                if (Notification.permission !== 'granted') return;
                const reg = await navigator.serviceWorker.register('/service-worker.js');
                const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: storeUrlBase64ToUint8Array('BB4adKD_jrSODVxxlh9R4-OOm0Bu8NIAfv507H6ZC0_12nvjVyQO0yjkRwIJnzUHhuQ8YV9W6ZLhdZNVS2dsmx0') });
                await fetch(`${API_URL}/push/subscribe`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${storeToken}` }, body: JSON.stringify({ endpoint: sub.endpoint, keys: { p256dh: btoa(String.fromCharCode(...new Uint8Array(sub.getKey('p256dh')))), auth: btoa(String.fromCharCode(...new Uint8Array(sub.getKey('auth')))) } }) });
            } catch (err) { console.log('Store push permission denied'); }
        }

        function navigateStore(page) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.querySelector(`[data-store="${page}"]`)?.classList.add('active');
            const content = document.getElementById('store-content');
            content.innerHTML = '';

            switch(page) {
                case 'dashboard': renderStoreDashboard(content); break;
                case 'orders': renderStoreOrders(content); break;
                case 'chat': renderStoreChat(content); break;
                case 'products': renderStoreProducts(content); break;
                case 'settings': renderStoreSettings(content); break;
                case 'store': renderStoreProfile(content); break;
                case 'wallet': renderStoreWallet(content); break;
                default: content.innerHTML = '<p>Page not found</p>';
            }
        }

        // ===== SELLER DASHBOARD =====
        async function renderStoreDashboard(container) {
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading dashboard...</div>';
            
            try {
                const analyticsRes = await fetch(`${API_URL}/orders/seller/analytics`, { headers: { 'Authorization': `Bearer ${storeToken}` } });
                const analytics = await analyticsRes.json();
                if (!analyticsRes.ok) throw new Error(analytics.error || 'Unable to load analytics');
                container.innerHTML = `<div class="store-header"><h2>${storeUser.store_name || storeUser.name}</h2><p>${storeUser.public_id}</p></div>${renderSellerAnalytics(analytics)}`;
            } catch (err) {
                container.innerHTML = `<p class="error-text">Error loading dashboard: ${err.message}</p>`;
            }
        }

        // ===== ORDERS PAGE =====
        async function renderStoreOrders(container) {
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading orders...</div>';
            try {
                const res = await fetch(`${API_URL}/orders/seller`, { headers: { 'Authorization': `Bearer ${storeToken}` } });
                const orders = await res.json();
                if (!res.ok || !Array.isArray(orders)) throw new Error(orders.error || 'Unable to load orders');
                container.innerHTML = `<div class="store-header"><h2>Orders</h2><p>${orders.length} order(s)</p></div><div class="order-filter-bar"><button onclick="filterStoreOrders('all')" class="filter-btn active" data-filter="all">All</button><button onclick="filterStoreOrders('new')" class="filter-btn" data-filter="new">New</button><button onclick="filterStoreOrders('approved')" class="filter-btn" data-filter="approved">Accepted</button><button onclick="filterStoreOrders('shipping')" class="filter-btn" data-filter="shipping">Shipping</button><button onclick="filterStoreOrders('delivered')" class="filter-btn" data-filter="delivered">Delivered</button><button onclick="filterStoreOrders('cancelled')" class="filter-btn" data-filter="cancelled">Cancelled</button></div><div id="store-orders-list">${orders.map(o => renderOrderCard(o)).join('') || '<p class="empty-text">No orders yet</p>'}</div>`;
                window._allOrders = orders;
            } catch (err) { container.innerHTML = `<p class="error-text">Error loading orders: ${err.message}</p>`; }
        }

        function renderSellerAnalytics(data) {
            const chart = (key, title, mode) => { const values = Array.isArray(data[key]) ? data[key] : []; const max = Math.max(...values.map(v => Number(v.sales || 0)), 1); return `<div class="analytics-card"><h3>${title}</h3><p class="small text-secondary">ဘားကိုနှိပ်ပါက A4 အရောင်းစာရင်း ပြပါမယ်။</p>${values.length ? `<div class="sales-bar-chart">${values.map(value => { const end = mode === 'day' ? value.label : (mode === 'week' ? value.label : value.label + '-28'); return `<button class="sales-bar" style="height:${Math.max(8, Math.round(Number(value.sales || 0) / max * 150))}px" title="${value.label}: ${Number(value.sales || 0).toLocaleString()} Ks" onclick="openSalesReport('${value.label}', '${mode}')"><span>${Number(value.sales || 0).toLocaleString()}</span><small>${value.label}</small></button>`; }).join('')}</div>` : '<p class="empty-text">No paid sales data yet</p>'}</div>`; };
            const charts = chart('daily', 'Daily Sales', 'day') + chart('weekly', 'Weekly Sales', 'week');
            const best = data.top_products?.[0]?.quantity || 1;
            const topProducts = (data.top_products || []).map((product, index) => `<div class="top-product-row"><div class="top-product-name">${index + 1}. ${escapeSellerProductText(product.title || 'Product')}</div><strong>${Number(product.quantity || 0).toLocaleString()} sold</strong><div class="top-product-bar"><i style="width:${Math.min(100, Number(product.quantity || 0) / best * 100)}%"></i></div></div>`).join('') || '<p class="empty-text">No paid sales data yet</p>';
            return `<section class="seller-analytics"><div class="analytics-heading"><h2>Sales Dashboard</h2><span>Paid orders only</span></div><div class="analytics-card analytics-date-filter"><label>ကြည့်မည့်ကာလ</label><input id="analytics-from" type="date"><input id="analytics-to" type="date"><button class="btn-primary" onclick="reloadSellerAnalytics()">ကြည့်မည်</button></div><div class="analytics-grid">${charts}</div><div class="analytics-card top-products-card"><h3>Best-selling products</h3>${topProducts}</div><div id="sales-report-panel"></div></section>`;
        }

        async function reloadSellerAnalytics() { const from = document.getElementById('analytics-from')?.value; const to = document.getElementById('analytics-to')?.value; if (!from || !to) return alert('နေ့စွဲနှစ်ခုလုံး ရွေးပါ'); const res = await fetch(`${API_URL}/orders/seller/sales-report?date_from=${from}&date_to=${to}`, { headers: { 'Authorization': `Bearer ${storeToken}` } }); const report = await res.json(); if (!res.ok) return alert(report.error || 'Unable to load sales report'); const dailyMap = {}; const weeklyMap = {}; (report.rows || []).forEach(row => { dailyMap[row.sale_date] = (dailyMap[row.sale_date] || 0) + Number(row.total_amount || 0); const date = new Date(`${row.sale_date}T00:00:00`); date.setDate(date.getDate() - date.getDay()); const week = date.toISOString().slice(0, 10); weeklyMap[week] = (weeklyMap[week] || 0) + Number(row.total_amount || 0); }); const data = { daily: Object.entries(dailyMap).map(([label, sales]) => ({ label, sales })), weekly: Object.entries(weeklyMap).map(([label, sales]) => ({ label, sales })), top_products: [] }; document.getElementById('store-content').innerHTML = `<div class="store-header"><h2>${storeUser.store_name || storeUser.name}</h2></div>${renderSellerAnalytics(data)}`; }
        async function openSalesReport(label, mode) { const from = label; const end = new Date(`${label}T00:00:00`); if (mode === 'week') end.setDate(end.getDate() + 6); const to = end.toISOString().slice(0, 10); const res = await fetch(`${API_URL}/orders/seller/sales-report?date_from=${from}&date_to=${to}`, { headers: { 'Authorization': `Bearer ${storeToken}` } }); const data = await res.json(); if (!res.ok) return alert(data.error || 'Unable to load sales report'); const rows = data.rows || []; document.getElementById('sales-report-panel').innerHTML = `<div class="a4-sales-report" id="a4-sales-report"><h2>${storeUser.store_name || 'Store'} — Sales Report</h2><p>${data.date_from} to ${data.date_to}</p><table><thead><tr><th>Date</th><th>Order</th><th>Book</th><th>Author</th><th>Buyer</th><th>Qty</th><th>Total Ks</th></tr></thead><tbody>${rows.map(r => `<tr><td>${r.sale_date}</td><td>${r.order_number}</td><td>${escapeSellerProductText(r.title)}</td><td>${escapeSellerProductText(r.author_name)}</td><td>${escapeSellerProductText(r.buyer_name)}</td><td>${r.quantity}</td><td>${Number(r.total_amount || 0).toLocaleString()}</td></tr>`).join('') || '<tr><td colspan="7">No sales</td></tr>'}</tbody></table><strong>Total: ${Number(data.total || 0).toLocaleString()} Ks</strong><button class="btn-primary" onclick="window.print()">Print / Save A4 PDF</button></div>`; document.getElementById('sales-report-panel').scrollIntoView({ behavior: 'smooth' }); }

        function filterStoreOrders(status) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-filter="${status}"]`)?.classList.add('active');
            
            const orders = window._allOrders || [];
            const container = document.getElementById('store-orders-list');
            if (!container) return;
            
            const filtered = status === 'all' ? orders : orders.filter(o => (o.order_status || 'new') === status);
            container.innerHTML = filtered.map(o => renderOrderCard(o)).join('') || '<p class="empty-text">No orders found</p>';
        }

        async function updateOrderStatus(orderId, status) {
            if (!confirm(`Update order status to "${status}"?`)) return;
            
            try {
                const res = await fetch(`${API_URL}/orders/${orderId}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${storeToken}`
                    },
                    body: JSON.stringify({ status })
                });
                
                if (res.ok) {
                    alert('Order status updated successfully!');
                    navigateStore('orders');
                } else {
                    const data = await res.json();
                    alert('Error: ' + (data.error || 'Unknown error'));
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function confirmCodSeller(orderId) {
            if (!confirm('Buyer proof is received. Confirm cash collected and create the 25-day commission payable?')) return;
            const res = await fetch(`${API_URL}/orders/${orderId}/cod/seller-confirm`, { method: 'POST', headers: { 'Authorization': `Bearer ${storeToken}` } });
            const data = await res.json();
            if (!res.ok) return alert(data.error || 'Unable to confirm COD order');
            alert(`COD confirmed. Commission payable: ${Number(data.commission_due || 0).toLocaleString()} Ks due in 25 days.`);
            navigateStore('orders');
        }

        function escapeSellerProductText(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
        }

        function getSellerProductImage(product) {
            try {
                const images = Array.isArray(product.images) ? product.images : JSON.parse(product.images || '[]');
                return typeof images[0] === 'string' ? images[0] : '';
            } catch (_) {
                return '';
            }
        }

        async function showProductList() {
            try {
                const res = await fetch(`${API_URL}/products/mine`, {
                    headers: { 'Authorization': `Bearer ${storeToken}` }
                });
                const products = await res.json();
                if (!res.ok) throw new Error(products.error || 'Unable to load products');
                sellerProductsCache = Array.isArray(products) ? products : [];

                document.getElementById('product-section').innerHTML = `
                    <div class="seller-product-list" aria-live="polite">
                        ${products.map((p, index) => {
                            const imageUrl = getSellerProductImage(p);
                            const price = Number(p.discounted_price || p.original_price || 0).toLocaleString();
                            const stock = Number(p.stock_quantity || 0).toLocaleString();
                            const status = p.is_active ? 'Active' : 'Inactive';
                            return `
                                <article class="seller-product-card">
                                    <div class="seller-product-cover ${imageUrl ? '' : 'is-empty'}">
                                        ${imageUrl ? `<img src="${escapeSellerProductText(imageUrl)}" alt="${escapeSellerProductText(p.title || 'Book cover')}" loading="lazy">` : '<span>Book image</span>'}
                                    </div>

                                        <div class="seller-product-meta"><span>Price - <strong>${price} Ks</strong></span><span>Stock - <strong>${stock}</strong></span><span>Sale - <strong>${escapeSellerProductText((p.sale_type || 'prepaid').toUpperCase())}</strong></span></div>
                                        <span class="seller-product-status ${p.is_active ? '' : 'is-inactive'}">${status}</span>
                                        <div class="seller-product-actions" aria-label="Product actions">
                                            <button type="button" onclick="editProduct(${Number(p.book_id)})">Edit</button>
                                            <button type="button" onclick="deleteProduct(${Number(p.book_id)})">Delete</button>

                document.getElementById('product-section').innerHTML = `<p class="error-text">Error: ${err.message}</p>`;
            }

        async function saveProductEdit(event, bookId) {
            event.preventDefault();
            const form = event.target;
            const body = Object.fromEntries(new FormData(form).entries());
            body.category_id = body.category_id || null;
            body.original_price = Number(body.original_price);
            body.discounted_price = body.discounted_price === '' ? body.original_price : Number(body.discounted_price);
            body.stock_quantity = Number(body.stock_quantity);
            const submit = form.querySelector('button[type="submit"]');
            submit.disabled = true;
            try {
                const res = await fetch(`${API_URL}/products/${bookId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${storeToken}` }, body: JSON.stringify(body) });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Unable to save product');
                alert('Product updated successfully.');
                await showProductList();
            } catch (err) {
                submit.disabled = false;
                alert(err.message);
            }
        }

        function setProductTab(index) {
            document.querySelectorAll('[data-product-tab]').forEach(panel => panel.classList.toggle('active', Number(panel.dataset.productTab) === index));
            document.querySelectorAll('.product-form-tabs .store-tab').forEach((tab, i) => tab.classList.toggle('active', i === index));
            document.getElementById('product-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function toggleSaleFields(type) {
            document.querySelectorAll('.preorder-only').forEach(el => { el.style.display = type === 'preorder' ? '' : 'none'; });
            document.querySelectorAll('.cod-only').forEach(el => { el.style.display = type === 'cod' ? '' : 'none'; });
        }

        function addVariation() {
            variationDrafts.push({ name: '', price: '', stock: '', files: [] });
            renderVariationEditor();
        }

        function updateVariation(index, field, value) {
            variationDrafts[index][field] = value;
        }

        function removeVariation(index) {
            variationDrafts.splice(index, 1);
            renderVariationEditor();
        }

        function handleVariationImages(index, input) {
            variationDrafts[index].files = Array.from(input.files || []).slice(0, 5);
            renderVariationEditor();
        }

        function renderVariationEditor() {
            const target = document.getElementById('variations-list');
            if (!target) return;
            target.innerHTML = variationDrafts.length ? variationDrafts.map((variation, index) => `
                <article class="variation-card">
                    <div class="variation-card-top"><span class="variation-number">OPTION ${String(index + 1).padStart(2, '0')}</span><button type="button" class="remove-variation" onclick="removeVariation(${index})" aria-label="Remove option"><i class="fas fa-trash-alt"></i></button></div>
                    <div class="variation-fields">
                        <label class="variation-field variation-name-field"><span>Option name</span><input type="text" value="${variation.name}" placeholder="e.g. Box Set" onchange="updateVariation(${index}, 'name', this.value)" required></label>
                        <label class="variation-field"><span>Price (Ks)</span><input type="number" min="0" value="${variation.price}" placeholder="15000" onchange="updateVariation(${index}, 'price', this.value)" required></label>
                        <label class="variation-field"><span>Stock</span><input type="number" min="0" value="${variation.stock}" placeholder="10" onchange="updateVariation(${index}, 'stock', this.value)" required></label>
                    </div>
                    <label class="variation-image-drop"><i class="fas fa-images"></i><span>Add option images <small>(up to 5)</small></span><input type="file" accept="image/*" multiple onchange="handleVariationImages(${index}, this)"></label>
                    <div class="variation-image-preview">${variation.files.map((file, fileIndex) => `<div><img src="${URL.createObjectURL(file)}" alt="${variation.name || 'Option'} image"><button type="button" onclick="variationDrafts[${index}].files.splice(${fileIndex}, 1); renderVariationEditor()">×</button></div>`).join('')}</div>
                </article>
            `).join('') : '<div class="variation-empty"><i class="fas fa-layer-group"></i><span>No options added yet</span><small>Use one when the same book has different formats.</small></div>';
        }

                function handleImageSelect(input) {
            selectedImages = Array.from(input.files);
            const preview = document.getElementById('image-preview');
            preview.innerHTML = selectedImages.map((file, i) => `
                <div style="position:relative;">
                    <img src="${URL.createObjectURL(file)}" alt="Preview ${i+1}">
                    <button type="button" onclick="removeImage(${i})" style="position:absolute;top:-8px;right:-8px;background:#dc3545;color:white;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;">×</button>
                </div>
            `).join('');
        }

        function removeImage(index) {
            selectedImages.splice(index, 1);
            const input = document.getElementById('prod-images');
            const dt = new DataTransfer();
            selectedImages.forEach(f => dt.items.add(f));
            input.files = dt.files;
            handleImageSelect(input);
        }

        async function submitProduct(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);
            const files = document.getElementById('prod-images').files;
            
            for (let f of files) {
                formData.append('images', f);
            }
            const variationPayload = variationDrafts.map(v => ({
                name: v.name.trim(),
                price: Number(v.price),
                stock: Number(v.stock),
                image_count: v.files.length
            }));
            if (variationPayload.some(v => !v.name || !Number.isFinite(v.price) || v.price < 0 || !Number.isInteger(v.stock) || v.stock < 0)) {
                return alert('Please complete every option name, price, and stock field.');
            }
            formData.set('variations', JSON.stringify(variationPayload));
            formData.set('variation_image_map', JSON.stringify(variationDrafts.map(v => v.files.length)));
            variationDrafts.forEach(v => v.files.forEach(file => formData.append('variation_images', file)));

            try {
                const res = await fetch(`${API_URL}/products`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${storeToken}` },
                    body: formData
                });

                if (res.ok) {
                    alert('Product added successfully!');
                    selectedImages = [];
                    showProductList();
                } else {
                    const data = await res.json();
                    alert('Error: ' + (data.error || 'Failed to add product'));
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function openStoreChat(conversationId) {
            const main = document.getElementById('store-content');
            main.innerHTML = `<div class="chat-page"><button class="btn-text" onclick="navigateStore('chat')"><i class="fas fa-arrow-left"></i> Back</button><h2 id="store-chat-peer-title">Conversation #${conversationId}</h2><div id="store-message-list" class="message-list">Loading...</div><form onsubmit="sendStoreChat(event, ${conversationId})" class="chat-compose"><input id="store-chat-input" required maxlength="2000" placeholder="Write a reply..."><button class="btn-primary">Send</button></form></div>`;
            const res = await fetch(`${API_URL}/chat/${conversationId}`, { headers: { 'Authorization': `Bearer ${storeToken}` } });
            const messages = await res.json();
            if (!res.ok) return document.getElementById('store-message-list').textContent = messages.error || 'Unable to load messages';
            const peer = messages.find(m => String(m.sender_id) !== `S${storeUser.seller_id}`)?.sender_name;
            if (peer) document.getElementById('store-chat-peer-title').textContent = peer;
            document.getElementById('store-message-list').innerHTML = messages.map(m => `<div class="message-bubble"><div>${String(m.content || '').replace(/[&<>"']/g, '')}</div><small>${String(m.sender_name || '')}</small></div>`).join('') || 'No messages yet';
        }

        async function sendStoreChat(event, conversationId) {
            event.preventDefault(); const input = document.getElementById('store-chat-input'); const content = input.value.trim(); if (!content) return;
            const res = await fetch(`${API_URL}/chat`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${storeToken}` }, body: JSON.stringify({ conversation_id: conversationId, content }) });
            const data = await res.json(); if (!res.ok) return alert(data.error || 'Unable to send message'); openStoreChat(conversationId);
        }

        async function deleteStoreChat(conversationId) {
            if (!confirm('ဒီ chat ကို သင့် chat list မှ ဖျက်မလား?')) return;
            const res = await fetch(`${API_URL}/chat/conversations/${conversationId}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${storeToken}` } });
            const data = await res.json();
            if (!res.ok) return alert(data.error || 'Unable to delete chat');
            renderStoreChat(document.getElementById('store-content'));
        }

        async function loadStoreSettings() {
            try {
                const res = await fetch(`${API_URL}/store/settings`, { headers: { 'Authorization': `Bearer ${storeToken}` } });
                const settings = await res.json();
                if (!res.ok) throw new Error(settings.error || 'Unable to load store settings');

        async function saveStoreSettings() {
            const payload = {
                is_open: document.getElementById('store-is-open').checked ? 1 : 0,
                accepting_orders: document.getElementById('store-accepting-orders').checked ? 1 : 0,
                reply_time_minutes: Number(document.getElementById('reply-time-minutes').value),
                reply_time_text: document.getElementById('reply-time-text').value.trim(),
                closed_message: document.getElementById('closed-message').value.trim(),
                auto_reply_message: document.getElementById('auto-reply-message').value.trim()
            };
            const res = await fetch(`${API_URL}/store/settings`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${storeToken}` }, body: JSON.stringify(payload) });
            const data = await res.json();
            if (!res.ok) return alert(data.error || 'Unable to save store settings');
            alert('Store availability saved');
            loadStoreSettings();
        }

        async function submitStoreWalletWithdrawal(event) {
            event.preventDefault();
            const amount = Number(document.getElementById('wallet-wd-amount').value);
            const payment_method = document.getElementById('wallet-wd-method').value;
            const account_name = document.getElementById('wallet-wd-name').value.trim();
            const account_phone = document.getElementById('wallet-wd-phone').value.trim();
            const error = document.getElementById('store-wallet-wd-error');
            if (!Number.isFinite(amount) || amount <= 0 || !account_name || !/^09\d{7,13}$/.test(account_phone.replace(/[\s-]/g, ''))) { error.textContent = 'Amount, account name and a valid 09 phone number are required'; return; }
            if (!confirm(`Step 1 of 2 — Withdraw ${amount.toLocaleString()} Ks to ${payment_method}?`)) return;
            if (!confirm('Step 2 of 2 — Submit this withdrawal request for Admin review?')) return;
            try {
                const res = await fetch(`${API_URL}/wallet/seller/withdraw`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${storeToken}` }, body: JSON.stringify({ amount, account_name, account_phone, payment_method }) });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Withdrawal failed');
                alert('Withdrawal request submitted for Admin review.');
                navigateStore('wallet');
            } catch (err) { error.textContent = err.message; }
        }

        async function saveStoreProfile(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData();
            ['store_name', 'name', 'email'].forEach(field => formData.append(field, form.elements[field].value.trim()));
            ['logo', 'banner'].forEach(field => { const file = form.elements[field].files?.[0]; if (file?.size) formData.append(field, file); });
            const res = await fetch(`${API_URL}/store/profile`, { method: 'PATCH', headers: { 'Authorization': `Bearer ${storeToken}` }, body: formData });
            const data = await res.json();
            if (!res.ok) return alert(data.error || 'Unable to save store profile');
            Object.assign(storeUser, { store_name: form.elements.store_name.value.trim(), name: form.elements.name.value.trim(), email: form.elements.email.value.trim(), logo: data.logo, banner: data.banner });
            alert('Store profile saved successfully');
        }

            const payment_method = document.getElementById('wd-method').value;

            if (!account_name || !account_phone) {

                return;
            }

            try {
                const res = await fetch(`${API_URL}/wallet/seller/withdraw`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${storeToken}`
                    },
                    body: JSON.stringify({ amount, account_name, account_phone, payment_method })
                });

                if (res.ok) {
                    alert('Withdrawal request submitted for Admin review.');
                    navigateStore('store');
                } else {
                    const data = await res.json();
                    alert('Error: ' + (data.error || 'Failed to request withdrawal'));
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }

        // Check night mode preference
        if (localStorage.getItem('spz_night') === 'true') {
            document.body.classList.add('night-mode');
        }

        // Start the app
        initStore();
    </script>
</body>
</html>
