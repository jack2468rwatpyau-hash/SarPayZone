<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Store Dashboard - Sar Pay Zone</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ================= PART 2: BASE LAYOUT & HEADER ================= */
        .store-header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 24px 16px; margin: -16px -16px 16px; border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
        .store-header h2, .store-header h3 { color: white; }
        .store-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
        .store-tab { flex: 1; padding: 12px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-secondary); font-weight: 600; cursor: pointer; }
        .store-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .store-shell { min-height: 100vh; }
        .store-drawer-backdrop { position:fixed; inset:0; background:rgba(20,30,24,.4); z-index:500; opacity:0; pointer-events:none; transition:opacity .2s; }
        .store-drawer { position:fixed; top:0; bottom:0; left:0; width:min(310px,86vw); background:var(--card); z-index:501; transform:translateX(-102%); transition:transform .22s ease-out; padding:20px 14px; overflow:auto; box-shadow:var(--shadow-lg); }
        .store-drawer.open { transform:translateX(0); }
        .store-drawer-backdrop.open { opacity:1; pointer-events:auto; }
        .drawer-brand { padding:10px 12px 20px; border-bottom:1px solid var(--border); margin-bottom:10px; }
        .drawer-nav { display:grid; gap:4px; }
        .drawer-nav button { width:100%; border:0; background:transparent; color:var(--text); padding:13px 12px; text-align:left; border-radius:10px; font:600 14px var(--font-sans); display:flex; gap:12px; align-items:center; cursor:pointer; }
        .drawer-nav button:hover,.drawer-nav button.active { background:var(--surface); color:var(--primary); }
        .drawer-footer { border-top:1px solid var(--border); margin-top:18px; padding-top:14px; display:grid; gap:10px; }
        .icon-menu { width: 60px; height: 40px; border-radius: 26%; border: none; background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text); }
        @media (min-width:800px) { .store-drawer { width:280px; } .main-content { margin-left:280px; } .menu-toggle { display:none; } .store-drawer { transform:none; } .store-drawer-backdrop { display:none; } }
    </style>
</head>
<!-- ================= PART 3: CSS PRODUCT LIST & ORDERS ================= -->
<style>
    .seller-product-list { display: grid; gap: 14px; }
    .seller-product-card { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 16px; align-items: stretch; padding: 14px; border: 1px solid rgba(45,125,79,.18); border-radius: 18px; background: #FFFFFF; box-shadow: 7px 8px 0 rgba(20, 42, 36, .12), 0 10px 22px rgba(20, 42, 36, .08); color: #102f2d; }
    .seller-product-cover { width: 84px; height: 112px; align-self: center; overflow: hidden; border: 1px solid rgba(255,255,255,.8); border-radius: 4px; background: #f9f9f7; box-shadow: 0 2px 6px rgba(20,42,36,.1); }
    .seller-product-cover img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .seller-product-cover.is-empty { display: grid; place-items: center; padding: 8px; color: #7d8581; text-align: center; font-size: 12px; font-weight: 700; }
    .seller-product-content { min-width: 0; display: flex; flex-direction: column; }
    .seller-product-id { align-self: flex-start; margin: -2px 0 8px; padding: 3px 9px; background: #13b7a5; color: #073a36; font-family: var(--font-mono); font-size: 12px; font-weight: 800; }
    .seller-product-title { margin: 0; overflow: hidden; color: #102f2d; font-size: 17px; line-height: 1.3; text-overflow: ellipsis; white-space: nowrap; }
    .seller-product-author { margin: 4px 0 0; overflow: hidden; color: #173f3b; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .seller-product-divider { height: 1px; margin: 12px 0 9px; background: rgba(16,47,45,.75); }
    .seller-product-meta { display: flex; justify-content: space-between; gap: 12px; color: #102f2d; font-size: 14px; }
    .seller-product-meta strong { font-weight: 800; }
    .seller-product-status { margin-left: 6px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .seller-product-status.is-inactive { color: #8a3027; }
    .seller-product-actions { display: flex; justify-content: flex-end; gap: 22px; margin-top: auto; padding-top: 10px; }
    .seller-product-actions button { border: 0; background: transparent; color: #165c3a; font-family: var(--font-sans); font-size: 15px; font-weight: 800; cursor: pointer; }

    .order-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
    .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .order-status { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; font-family: var(--font-mono); text-transform: uppercase; }
    .status-new { background: hsl(210, 60%, 92%); color: hsl(212, 70%, 38%); }
    .status-approved { background: hsl(38, 85%, 92%); color: hsl(30, 75%, 38%); }
    .status-shipping { background: hsl(154, 40%, 90%); color: hsl(154, 40%, 30%); }
    .status-delivered { background: hsl(154, 40%, 90%); color: hsl(154, 45%, 24%); }
    .status-cancelled { background: hsl(3, 55%, 93%); color: hsl(3, 60%, 40%); }
    .order-body { display: flex; gap: 12px; }
    .order-info { flex: 1; }
    .order-info h4 { font-size: 14px; margin-bottom: 4px; }
    .order-info p { font-size: 13px; color: var(--text-secondary); margin: 2px 0; }
    .order-actions { display: flex; gap: 16px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .order-actions .btn-text { font-size: 13px; }
    @media (max-width: 420px) { .seller-product-card { grid-template-columns: 72px minmax(0, 1fr); gap: 11px; padding: 11px; } .seller-product-cover { width: 72px; height: 96px; } .seller-product-title { font-size: 15px; } .seller-product-meta { font-size: 12px; } .seller-product-actions { gap: 13px; } }
</style>
<!-- ================= PART 4: CSS COMPACT PRODUCT FORM & NEW FEATURES ================= -->
<style>
    /* Compact Product Form - scrollable, roomier grid layout */
    .compact-product-form {
        display: flex;
        flex-direction: column;
        max-height: calc(100dvh - 130px);
        overflow: hidden;
        padding: 0 12px 12px 12px;
        box-sizing: border-box;
    }
    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 10px;
        flex: 1;
        overflow-y: auto;
        align-content: start;
        padding: 4px 2px 16px;
    }
    .compact-product-form .form-group { margin-bottom: 0; gap: 5px; display: flex; flex-direction: column; }
    .compact-product-form label { font-size: 13px !important; margin-bottom: 0; color: var(--text-secondary); font-weight: 600; }
    .compact-product-form input,
    .compact-product-form select,
    .compact-product-form textarea {
        padding: 10px 12px;
        font-size: 14px !important;
        min-height: 42px;
        border-radius: 10px;
        background: var(--bg);
        border: 1px solid var(--border);
        width: 100%;
        box-sizing: border-box;
    }
    .compact-product-form textarea { resize: none; min-height: 70px; max-height: 110px; }
    .compact-product-form .full-width { grid-column: 1 / -1; }

    /* Sale Type Toggle Buttons */
    .sale-type-toggle-group { display: flex; gap: 8px; margin-bottom: 14px; padding-top: 10px; flex-shrink: 0; }
    .sale-type-toggle-group button { flex: 1; padding: 11px 6px; font-size: 14px; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; cursor: pointer; font-weight: bold; color: var(--text); transition: 0.2s; }
    .sale-type-toggle-group button.active { background: var(--primary); color: white; border-color: var(--primary); }

    /* Compact Image Upload */
    .compact-image-upload { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-height: 64px; }
    .compact-image-preview { position: relative; width: 64px; height: 64px; flex-shrink: 0; }
    .compact-image-preview img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
    .compact-image-preview button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: #dc3545; color: white; border: none; font-size: 12px; line-height: 1; cursor: pointer; }
    .compact-image-add { width: 64px; height: 64px; border: 1.5px dashed var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-secondary); flex-shrink: 0; background: var(--surface); font-size: 20px; }

    /* Compact Variations */
    .compact-variation-list { display: flex; flex-direction: column; gap: 10px; max-height: none; overflow-y: visible; }
    .compact-variation-card { border: 1px solid var(--border); border-radius: 10px; padding: 8px; background: var(--surface); }
    .compact-variation-row { display: grid; grid-template-columns: 1fr 70px 60px 32px; gap: 6px; align-items: center; }
    .compact-variation-row input { min-height: 38px !important; padding: 6px 8px !important; font-size: 13px !important; }
    .compact-variation-row button { background: #fee2e2; color: #dc2626; border: none; border-radius: 8px; height: 38px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    .compact-variation-images { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
    .compact-variation-images .compact-image-preview { width: 48px; height: 48px; }
    .compact-variation-images .compact-image-add { width: 48px; height: 48px; font-size: 16px; }

    /* Actions */
    .compact-actions { display: flex; gap: 10px; padding: 12px 0 0 0; margin-top: 4px; flex-shrink: 0; background: var(--card); border-top: 1px solid var(--border); }
    .compact-actions button { flex: 1; padding: 12px; font-size: 14px; min-height: 44px; border-radius: 10px; }

    /* Settings & Analytics */
    .settings-accordion { background:var(--card); border:1px solid var(--border); border-radius:14px; margin:12px 0; overflow:hidden; }
    .settings-accordion summary { cursor:pointer; list-style:none; padding:16px; font-weight:700; display:flex; justify-content:space-between; align-items:center; }
    .settings-accordion summary::-webkit-details-marker { display:none; }
    .settings-accordion summary::after { content:'+'; color:var(--primary); font-size:20px; }
    .settings-accordion[open] summary::after { content:'−'; }
    .settings-accordion .settings-section { border:0; border-top:1px solid var(--border); border-radius:0; margin:0; }

    /* Fixed Bar Chart Layout */
    .analytics-grid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px; }
    .analytics-card { min-width:0; padding:12px; border:1px solid var(--border); border-radius:12px; background:var(--card); box-shadow:var(--shadow); }
    .sales-bar-chart { display: flex; align-items: flex-end; gap: 8px; min-height: 180px; padding: 10px 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .sales-bar-wrapper { display: flex; flex-direction: column; align-items: center; min-width: 45px; height: 100%; justify-content: flex-end; gap: 4px; }
    .sales-value-top { font-size: 9px; color: var(--text-secondary); white-space: nowrap; }
    .sales-bar { width: 30px; background: var(--primary); border: none; border-radius: 4px 4px 0 0; cursor: pointer; transition: filter .15s; }
    .sales-bar:hover { filter: brightness(1.18); }
    .sales-date-bottom { font-size: 9px; color: var(--text-secondary); transform: rotate(-45deg); margin-top: 5px; white-space: nowrap; }

    /* Wallet Toggle Group */
    .wallet-toggle-group { display: flex; gap: 4px; margin-bottom: 12px; padding-top: 4px; }
    .wallet-toggle-group button { flex: 1; padding: 8px 4px; font-size: 12px; border: 1px solid var(--border); background: var(--surface); border-radius: 6px; cursor: pointer; font-weight: bold; color: var(--text); transition: 0.2s; }
    .wallet-toggle-group button.active { background: var(--primary); color: white; border-color: var(--primary); }

    /* Info Icon & Text */
    .info-icon { color: var(--primary); cursor: pointer; margin-left: 5px; font-size: 12px; }
    .info-text { display: none; font-size: 10px; color: var(--text-secondary); margin-top: 4px; background: var(--surface); padding: 6px; border-radius: 6px; border-left: 2px solid var(--primary); }
    .info-text.show { display: block; }

    @media (max-width: 760px) { .analytics-grid { grid-template-columns:1fr; } }
@media (max-width: 560px) {
    #store-app {
        padding-top: 0 !important;
    }
}
</style>
<!-- ================= PART 5: HTML APP SHELL & DRAWER ================= -->
<body>
    <div id="store-app" class="store-shell">
        <header class="app-header">
            <button class="icon-menu" onclick="toggleStoreMenu()" aria-label="Open menu"><i class="fas fa-bars"></i><span>မီနူး</span></button>
            <div> <img src="partnerLogo.png" alt="partnerLogo" width="100" /></div>
            <button onclick="logout()" class="icon-btn"><i class="fas fa-sign-out-alt"></i></button>
        </header>

        <div id="store-drawer-backdrop" class="store-drawer-backdrop" onclick="toggleStoreMenu(false)"></div>
        <aside id="store-drawer" class="store-drawer" aria-label="Store navigation">
            <div class="drawer-brand"><strong>Sar Pay Zone</strong><p id="drawer-store-name" class="small text-secondary">Store Portal</p></div>
            <nav class="drawer-nav">
                <button onclick="navigateStore('dashboard');toggleStoreMenu(false)"><i class="fas fa-chart-line"></i><span>ဒက်ရှ်ဘုတ်</span></button>
                <button onclick="navigateStore('orders');toggleStoreMenu(false)"><i class="fas fa-clipboard-list"></i><span>အော်ဒါများ</span></button>
                <button onclick="navigateStore('products');toggleStoreMenu(false)"><i class="fas fa-book"></i><span>ပစ္စည်းများ</span></button>
                <button onclick="navigateStore('settings');toggleStoreMenu(false)"><i class="fas fa-cog"></i><span>ဆက်တင်</span></button>
                <button onclick="navigateStore('store');toggleStoreMenu(false)"><i class="fas fa-shop"></i><span>ဆိုင်</span></button>
                <button onclick="navigateStore('wallet');toggleStoreMenu(false)"><i class="fas fa-wallet"></i><span>ဆိုင် Wallet</span></button>
                <button onclick="navigateStore('cod-commission');toggleStoreMenu(false)"><i class="fas fa-file-invoice-dollar"></i><span>Monthly COD Commission</span></button>
                <button onclick="navigateStore('chat');toggleStoreMenu(false)"><i class="fas fa-comments"></i><span>စာတိုများ</span></button>
            </nav>
            <div class="drawer-footer"><button class="btn-text danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>ထွက်မည်</span></button></div>
        </aside>

        <main id="store-content" class="main-content"></main>
    </div>
    <!-- ================= PART 6: JS INIT & GLOBAL ================= -->
<script>
    const API_URL = 'https://sarpayzone-production.up.railway.app/api';
    function toggleStoreMenu(force) { const open = typeof force === 'boolean' ? force : !document.getElementById('store-drawer').classList.contains('open'); document.getElementById('store-drawer').classList.toggle('open', open); document.getElementById('store-drawer-backdrop').classList.toggle('open', open); }
    let storeToken = localStorage.getItem('spz_store_token');
    let storeUser = null;
    let storePasswordCode = null;
    let selectedImages = [];
    let variationDrafts = [];
    let sellerProductsCache = [];

    // Placeholder for Info Icon Toggle
    function toggleInfo(id) {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('show');
    }

    async function initStore() {
        if (!storeToken) { window.location.href = '/publisherlogin.html'; return; }
        try {
            const res = await fetch(`${API_URL}/auth/me`, { headers: { 'Authorization': `Bearer ${storeToken}` } });
            if (!res.ok) { logout(); return; }
            storeUser = (await res.json()).user;
            if (!['publisher', 'bookstore', 'commission_store'].includes(storeUser?.role)) { logout(); return; }
            document.getElementById('drawer-store-name').textContent = storeUser.store_name || storeUser.name || 'Store Portal';
            const codeRes = await fetch(`${API_URL}/auth/seller/store-code`, { headers: { 'Authorization': `Bearer ${storeToken}` } });
            if (codeRes.ok) storePasswordCode = await codeRes.json();
            requestStorePushPermission();
            navigateStore('dashboard');
        } catch (err) { console.error('Init error:', err); logout(); }
    }

    function storeUrlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
        const rawData = atob((base64String + padding).replace(/-/g, '+').replace(/_/g, '/'));
        return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
    }

    async function requestStorePushPermission() {
        if (!('serviceWorker' in navigator) || !('PushManager' in window) || Notification.permission === 'denied') return;
        try {
            if (Notification.permission === 'default') await Notification.requestPermission();
            if (Notification.permission !== 'granted') return;
            const reg = await navigator.serviceWorker.register('/service-worker.js');
            const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: storeUrlBase64ToUint8Array('BB4adKD_jrSODVxxlh9R4-OOm0Bu8NIAfv507H6ZC0_12nvjVyQO0yjkRwIJnzUHhuQ8YV9W6ZLhdZNVS2dsmx0') });
            await fetch(`${API_URL}/push/subscribe`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${storeToken}` }, body: JSON.stringify({ endpoint: sub.endpoint, keys: { p256dh: btoa(String.fromCharCode(...new Uint8Array(sub.getKey('p256dh')))), auth: btoa(String.fromCharCode(...new Uint8Array(sub.getKey('auth')))) } }) });
        } catch (err) { console.log('Store push permission denied'); }
    }

    function navigateStore(page) {
        document.querySelectorAll('.drawer-nav button').forEach(n => n.classList.remove('active'));
        document.querySelector(`.drawer-nav button[onclick*="navigateStore('${page}')"]`)?.classList.add('active');
        const content = document.getElementById('store-content');
        content.innerHTML = '';
        switch(page) {
            case 'dashboard': renderStoreDashboard(content); break;
            case 'orders': renderStoreOrders(content); break;
            case 'chat': renderStoreChat(content); break;
            case 'products': renderStoreProducts(content); break;
            case 'settings': renderStoreSettings(content); break;
            case 'store': renderStoreProfile(content); break;
            case 'wallet': renderStoreWallet(content); break;
            case 'cod-commission': renderCodCommission(content); break;
            default: content.innerHTML = '<p>Page not found</p>';
        }
    }
</script>
<!-- ================= PART 7: JS DASHBOARD & ANALYTICS ================= -->
<script>
    async function renderStoreDashboard(container) {
        container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading dashboard...</div>';
        try {
            const analyticsRes = await fetch(`${API_URL}/orders/seller/analytics`, { headers: { 'Authorization': `Bearer ${storeToken}` } });
            const analytics = await analyticsRes.json();
            if (!analyticsRes.ok) throw new Error(analytics.error || 'Unable to load analytics');
            container.innerHTML = `<div class="store-header"><h2>${storeUser.store_name || storeUser.name}</h2><p>${storeUser.public_id}</p></div>${renderSellerAnalytics(analytics)}`;
        } catch (err) { container.innerHTML = `<p class="error-text">Error loading dashboard: ${err.message}</p>`; }
    }

    function renderSellerAnalytics(data) {
        const chart = (key, title, mode) => {
            const values = Array.isArray(data[key]) ? data[key] : [];
            const max = Math.max(...values.map(v => Number(v.sales || 0)), 1);
            const width = 600, height = 145, pad = 18;
            const points = values.map((value, index) => {
                const x = values.length === 1 ? width / 2 : pad + (index * (width - pad * 2) / (values.length - 1));
                const y = height - pad - (Number(value.sales || 0) / max) * (height - pad * 2);
                return `${x.toFixed(1)},${y.toFixed(1)}`;
            }).join(' ');
            return `
            <div class="analytics-card">
                <h3>${title} <i class="fas fa-info-circle info-icon" onclick="toggleInfo('info-${key}')"></i></h3>
                <p id="info-${key}" class="info-text">ရောင်းအားအခြေအနေများအားရက်စွဲ/ရက်သတ္တပတ် အလိုက်ကြည့်ရှုနိုင်သည်။</p>
                ${values.length ? `
                <svg class="sales-line-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="${title}">
                    <polyline points="${points}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline>
                    ${values.map((value, index) => { const [x, y] = points.split(' ')[index].split(','); const label = String(value.label || '').replace(/'/g, "\\'"); return `<circle cx="${x}" cy="${y}" r="4" fill="var(--card)" stroke="currentColor" stroke-width="2" onclick="openSalesReport('${label}', '${mode}')"><title>${value.label}: ${Number(value.sales || 0).toLocaleString()} Ks</title></circle>`; }).join('')}
                </svg>
                <div class="chart-labels">${values.map(value => `<span>${value.label}</span>`).join('')}</div>` : '<p class="empty-text">No paid sales data yet</p>'}
            </div>`;
        };
        const charts = chart('daily', 'Daily Sales', 'day') + chart('weekly', 'Weekly Sales', 'week');
        window._sellerKpis = data.kpis || {};
        const kpi = data.kpis?.month || data.kpis?.week || {};
        const money = value => `${Number(value || 0).toLocaleString()} Ks`;
        const percent = value => `${Number(value || 0).toFixed(1)}%`;
        const kpiCards = [
            ['Total Revenue', money(kpi.revenue), 'This month', 'fa-coins'],
            ['Total Orders', Number(kpi.orders || 0).toLocaleString(), 'Paid orders', 'fa-shopping-bag'],
            ['Average Order Value', money(kpi.aov), 'Revenue ÷ orders', 'fa-receipt'],
            ['Conversion Rate', percent(kpi.conversion_rate), `${Number(kpi.visitors || 0).toLocaleString()} visitors`, 'fa-chart-line']
        ].map(([label, value, note, icon]) => `<div class="seller-kpi-card"><i class="fas ${icon}"></i><span>${label}</span><strong>${value}</strong><small>${note}</small></div>`).join('');
        const best = data.top_products?.[0]?.quantity || 1;
        const topProducts = (data.top_products || []).map((product, index) => `<div class="top-product-row"><div class="top-product-name">${index + 1}. ${escapeSellerProductText(product.title || 'Product')}</div><strong>${Number(product.quantity || 0).toLocaleString()} sold</strong><div class="top-product-bar"><i style="width:${Math.min(100, Number(product.quantity || 0) / best * 100)}%"></i></div></div>`).join('') || '<p class="empty-text">No paid sales data yet</p>';
        const lowStock = data.inventory?.low_stock || [];
        const outOfStock = data.inventory?.out_of_stock || [];
        const stockRows = lowStock.map(product => `<div class="stock-alert-row"><span>${escapeSellerProductText(product.title || 'Product')}</span><strong>${Number(product.stock_quantity || 0)} left</strong></div>`).join('') || '<p class="empty-text">No low-stock products</p>';

        return `
        <section class="seller-analytics">
            <div class="analytics-heading">
                <h2>Sales Dashboard <i class="fas fa-info-circle info-icon" onclick="toggleInfo('info-dashboard')"></i></h2>
                <span>Paid orders only</span>
            </div>
            <p id="info-dashboard" class="info-text">ရောင်းအားအခြေအနေများအား ပြေစာထုတ်ခြင်း ရောင်းအားအကောင်းဆုံးပစ္စည်းများအားလုံးကိုကြည့်နိုင်သည်။</p>
            <div class="kpi-period-switcher"><span>Period</span><button class="active" onclick="selectKpiPeriod('month', this)">Month</button><button onclick="selectKpiPeriod('week', this)">7 days</button><button onclick="selectKpiPeriod('today', this)">Today</button></div>
            <div class="seller-kpi-grid">${kpiCards}</div>
            <div class="analytics-card analytics-date-filter" style="margin-top:10px;">
                <label>ကြည့်မည့်ကာလ</label>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <input id="analytics-from" type="date" style="flex:1;">
                    <input id="analytics-to" type="date" style="flex:1;">
                    <button class="btn-primary" onclick="reloadSellerAnalytics()" style="width:100%; margin-top:8px;">ကြည့်မည်</button>
                </div>
            </div>
            <div class="analytics-grid" style="margin-top:10px;">${charts}</div>
            <div class="analytics-card top-products-card" style="margin-top:10px;">
                <h3>ရောင်းအားအကောင်းဆုံး စာအုပ်များ <i class="fas fa-info-circle info-icon" onclick="toggleInfo('info-top')"></i></h3>
                <p id="info-top" class="info-text">အရောင်းရဆုံးစာအုပ်များအား နာမည်နှင့်အရေအတွက်ကိုပြသထားသည်။</p>
                ${topProducts}
            </div>
            <div class="inventory-status-grid">
                <div class="analytics-card stock-alert-card"><h3>Low Stock Alerts</h3>${stockRows}</div>
                <div class="analytics-card stock-alert-card"><h3>Out of Stock <strong class="stock-count">${outOfStock.length}</strong></h3>${outOfStock.map(product => `<div class="stock-alert-row out"><span>${escapeSellerProductText(product.title || 'Product')}</span><strong>Out of stock</strong></div>`).join('') || '<p class="empty-text">No out-of-stock products</p>'}</div>
            </div>
            <div id="sales-report-panel"></div>
        </section>`;
    }

    function selectKpiPeriod(period, button) {
        const kpi = window._sellerKpis?.[period] || {};
        const cards = document.querySelectorAll('.seller-kpi-card');
        if (cards.length < 4) return;
        cards[0].querySelector('strong').textContent = `${Number(kpi.revenue || 0).toLocaleString()} Ks`;
        cards[0].querySelector('small').textContent = period === 'today' ? 'Today' : period === 'week' ? 'Last 7 days' : 'This month';
        cards[1].querySelector('strong').textContent = Number(kpi.orders || 0).toLocaleString();
        cards[2].querySelector('strong').textContent = `${Number(kpi.aov || 0).toLocaleString()} Ks`;
        cards[3].querySelector('strong').textContent = `${Number(kpi.conversion_rate || 0).toFixed(1)}%`;
        cards[3].querySelector('small').textContent = `${Number(kpi.visitors || 0).toLocaleString()} visitors`;
        document.querySelectorAll('.kpi-period-switcher button').forEach(item => item.classList.toggle('active', item === button));
    }

    async function reloadSellerAnalytics() {
        const from = document.getElementById('analytics-from')?.value;
        const to = document.getElementById('analytics-to')?.value;
        if (!from || !to) return alert('နေ့စွဲနှစ်ခုလုံး ရွေးပါ');
        const res = await fetch(`${API_URL}/orders/seller/sales-report?date_from=${from}&date_to=${to}`, { headers: { 'Authorization': `Bearer ${storeToken}` } });
        const report = await res.json();
        if (!res.ok) return alert(report.error || 'Unable to load sales report');
        const dailyMap = {};
        const weeklyMap = {};
        (report.rows || []).forEach(row => {
            dailyMap[row.sale_date] = (dailyMap[row.sale_date] || 0) + Number(row.total_amount || 0);
            const date = new Date(`${row.sale_date}T00:00:00`);
            date.setDate(date.getDate() - date.getDay());
            const week = date.toISOString().slice(0, 10);
            weeklyMap[week] = (weeklyMap[week] || 0) + Number(row.total_amount || 0);
        });
        const data = { daily: Object.entries(dailyMap).map(([label, sales]) => ({ label, sales })), weekly: Object.entries(weeklyMap).map(([label, sales]) => ({ label, sales })), top_products: [] };
        document.getElementById('store-content').innerHTML = `<div class="store-header"><h2>${storeUser.store_name || storeUser.name}</h2></div>${renderSellerAnalytics(data)}`;
    }

    async function openSalesReport(label, mode) {
        const from = label;
        const end = new Date(`${label}T00:00:00`);
        if (mode === 'week') end.setDate(end.getDate() + 6);
        const to = end.toISOString().slice(0, 10);
        const res = await fetch(`${API_URL}/orders/seller/sales-report?date_from=${from}&date_to=${to}`, { headers: { 'Authorization': `Bearer ${storeToken}` } });
        const data = await res.json();
        if (!res.ok) return alert(data.error || 'Unable to load sales report');
        const rows = data.rows || [];
        document.getElementById('sales-report-panel').innerHTML = `<div class="a4-sales-report" id="a4-sales-report"><h2>${storeUser.store_name || 'Store'} — Sales Report</h2><p>${data.date_from} to ${data.date_to}</p><table><thead><tr><th>Date</th><th>Order</th><th>Book</th><th>Author</th><th>Buyer</th><th>Qty</th><th>Total Ks</th></tr></thead><tbody>${rows.map(r => `<tr><td>${r.sale_date}</td><td>${r.order_number}</td><td>${escapeSellerProductText(r.title)}</td><td>${escapeSellerProductText(r.author_name)}</td><td>${escapeSellerProductText(r.buyer_name)}</td><td>${r.quantity}</td><td>${Number(r.total_amount || 0).toLocaleString()}</td></tr>`).join('') || '<tr><td colspan="7">No sales</td></tr>'}</tbody></table><strong>Total: ${Number(data.total || 0).toLocaleString()} Ks</strong><button class="btn-primary" onclick="window.print()">Print / Save A4 PDF</button></div>`;
        document.getElementById('sales-report-panel').scrollIntoView({ behavior: 'smooth' });
    }
</script>
<!-- ================= PART 8: JS ORDERS ================= -->
<script>
    async function renderStoreOrders(container) {
        container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading orders...</div>';
        try {
            const res = await fetch(`${API_URL}/orders/seller`, { headers: { 'Authorization': `Bearer ${storeToken}` } });
            const orders = await res.json();
            if (!res.ok || !Array.isArray(orders)) throw new Error(orders.error || 'Unable to load orders');
            container.innerHTML = `
            <div class="store-header">
                <h2>Orders <i class="fas fa-info-circle info-icon" onclick="toggleInfo('info-orders')"></i></h2>
                <p>${orders.length} order(s)</p>
            </div>
            <p id="info-orders" class="info-text">အော်ဒါများကို အတည်ပြုခြင်း၊ပယ်ချခြင်း၊ပို့ဆောင်ခြင်း၊အောင်မြင်ခြင်း အခြေအနေများရွေးချယ်နိုင်သည်။</p>
            <div class="order-filter-bar">
                <button onclick="filterStoreOrders('all')" class="filter-btn active" data-filter="all">အားလုံး</button>
                <button onclick="filterStoreOrders('new')" class="filter-btn" data-filter="new">အော်ဒါအသစ်</button>
                <button onclick="filterStoreOrders('approved')" class="filter-btn" data-filter="approved">လက်ခံပြီး</button>
                <button onclick="filterStoreOrders('shipping')" class="filter-btn" data-filter="shipping">ပို့ဆောင်နေ</button>
                <button onclick="filterStoreOrders('delivered')" class="filter-btn" data-filter="delivered">ပို့ဆောင်ပြီး</button>
                <button onclick="filterStoreOrders('cancelled')" class="filter-btn" data-filter="cancelled">ပယ်ချထားသော</button>
            </div>
            <div id="store-orders-list">${orders.map(o => renderOrderCard(o)).join('') || '<p class="empty-text">No orders yet</p>'}</div>`;
            window._allOrders = orders;
        } catch (err) { container.innerHTML = `<p class="error-text">Error loading orders: ${err.message}</p>`; }
    }

    function renderOrderCard(o) {
        const statusClass = o.order_status || 'new';
        return `
            <div class="order-card" data-status="${statusClass}">
                <div class="order-header">
                    <span class="order-number">${o.order_number}</span>
                    <span class="order-status status-${statusClass}">${statusClass.toUpperCase()}</span>
                </div>
                <div class="order-body">
                    <div class="order-info">
                        <h4>${o.title || 'Product'}</h4>
                        <p>Buyer: ${o.buyer_name || 'N/A'} | ${o.buyer_phone || ''}</p>
                        <p>Qty: ${o.quantity || 1} | Total: ${(o.total_amount || 0).toLocaleString()} Ks</p>
                        <p class="small text-secondary">Commission: ${(o.commission_amount || 0).toLocaleString()} Ks</p>
                        ${o.shipping_address ? `<p class="small text-secondary">Address: ${o.shipping_address}</p>` : ''}
                    </div>
                </div>
                <div class="order-actions">
                    ${statusClass === 'new' ? `<button onclick="updateOrderStatus(${o.order_id}, 'approved')" class="btn-text success">Accept</button>` : ''}
                    ${statusClass === 'approved' ? `<button onclick="updateOrderStatus(${o.order_id}, 'shipping')" class="btn-text">Ship</button>` : ''}
                    ${statusClass === 'shipping' && o.payment_method === 'cod' ? (o.buyer_delivery_confirmed_at ? `<button onclick="confirmCodSeller(${o.order_id})" class="btn-text success">Confirm COD payment</button>` : '<span class="small text-secondary">Waiting for buyer delivery photo</span>') : ''}
                    ${statusClass === 'shipping' && o.payment_method !== 'cod' ? `<button onclick="updateOrderStatus(${o.order_id}, 'delivered')" class="btn-text success">Deliver</button>` : ''}
                    ${statusClass === 'new' ? `<button onclick="updateOrderStatus(${o.order_id}, 'cancelled')" class="btn-text danger">Cancel</button>` : ''}
                    <button onclick="startChat(${o.buyer_id}, ${o.order_id})" class="btn-text"><i class="fas fa-comment"></i> Chat</button>
                </div>
            </div>
        `;
    }

    function filterStoreOrders(status) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-filter="${status}"]`)?.classList.add('active');
        const orders = window._allOrders || [];
        const container = document.getElementById('store-orders-list');
        if (!container) return;
        const filtered = status === 'all' ? orders : orders.filter(o => (o.order_status || 'new') === status);
        container.innerHTML = filtered.map(o => renderOrderCard(o)).join('') || '<p class="empty-text">No orders found</p>';
    }

    async function updateOrderStatus(orderId, status) {
        if (!confirm(`Update order status to "${status}"?`)) return;
        try {
            const res = await fetch(`${API_URL}/orders/${orderId}/status`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${storeToken}` },
                body: JSON.stringify({ status })
            });
            if (res.ok) { alert('Order status updated successfully!'); navigateStore('orders'); }
            else { const data = await res.json(); alert('Error: ' + (data.error || 'Unknown error')); }
        } catch (err) { alert('Error: ' + err.message); }
    }

    async function confirmCodSeller(orderId) {
        if (!confirm('Buyer proof is received. Confirm cash collected and add this COD sale to the current monthly commission ledger?')) return;
        const res = await fetch(`${API_URL}/orders/${orderId}/cod/seller-confirm`, { method: 'POST', headers: { 'Authorization': `Bearer ${storeToken}` } });
        const data = await res.json();
        if (!res.ok) return alert(data.error || 'Unable to confirm COD order');
        alert(`COD confirmed. Monthly commission recorded: ${Number(data.commission_due || 0).toLocaleString()} Ks.`);
        navigateStore('orders');
    }
</script>
<!-- ================= PART 9: JS PRODUCTS LIST & EDIT ================= -->
<script>
    async function renderStoreProducts(container) {
        container.innerHTML = `
            <div class="store-tabs">
                <button class="store-tab active" onclick="showProductList()">Product List</button>
                <button class="store-tab" onclick="showAddProduct()">Add New</button>
            </div>
            <div id="product-section"></div>
        `;
        await showProductList();
    }

    function filterSellerProducts() {
        const query = (document.getElementById('product-search-input')?.value || '').trim().toLowerCase();
        renderSellerProductList(query);
    }

    function escapeSellerProductText(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
    }

    function getSellerProductImage(product) {
        try {
            const images = Array.isArray(product.images) ? product.images : JSON.parse(product.images || '[]');
            return typeof images[0] === 'string' ? images[0] : '';
        } catch (_) { return ''; }
    }

    async function showProductList() {
        document.getElementById('product-section').innerHTML = `
            <div class="product-search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="product-search-input" placeholder="စာအုပ်အမည် (သို့) ID ဖြင့်ရှာပါ..." oninput="filterSellerProducts()">
            </div>
            <div id="seller-product-list-wrap"></div>
        `;
        try {
            const res = await fetch(`${API_URL}/products/mine`, { headers: { 'Authorization': `Bearer ${storeToken}` } });
            const products = await res.json();
            if (!res.ok) throw new Error(products.error || 'Unable to load products');
            sellerProductsCache = Array.isArray(products) ? products : [];
            renderSellerProductList();
            document.querySelectorAll('.store-tab').forEach(t => t.classList.remove('active'));
            document.querySelector('.store-tab:first-child')?.classList.add('active');
        } catch (err) { document.getElementById('seller-product-list-wrap').innerHTML = `<p class="error-text">Error: ${err.message}</p>`; }
    }

    function renderSellerProductList(query) {
        const wrap = document.getElementById('seller-product-list-wrap');
        if (!wrap) return;
        const q = (query || '').trim().toLowerCase();
        const products = !q ? sellerProductsCache : sellerProductsCache.filter(p =>
            String(p.title || '').toLowerCase().includes(q) ||
            String(p.public_id || '').toLowerCase().includes(q)
        );
        wrap.innerHTML = `
            <div class="seller-product-list" aria-live="polite">
                ${products.map((p) => {
                    const index = sellerProductsCache.indexOf(p);
                    const imageUrl = getSellerProductImage(p);
                    const price = Number(p.discounted_price || p.original_price || 0).toLocaleString();
                    const stock = Number(p.stock_quantity || 0).toLocaleString();
                    const status = p.is_active ? 'Active' : 'Inactive';
                    return `
                        <article class="seller-product-card">
                            <div class="seller-product-cover ${imageUrl ? '' : 'is-empty'}">
                                ${imageUrl ? `<img src="${escapeSellerProductText(imageUrl)}" alt="${escapeSellerProductText(p.title || 'Book cover')}" loading="lazy">` : '<span>Book image</span>'}
                            </div>
                            <div class="seller-product-content">
                                <span class="seller-product-id">NO - ${index + 1} &nbsp;|&nbsp; ${escapeSellerProductText(p.public_id || '—')}</span>
                                <h3 class="seller-product-title">Book name - ${escapeSellerProductText(p.title || 'Untitled')}</h3>
                                <p class="seller-product-author">Author - ${escapeSellerProductText(p.author_name || 'Unknown author')}</p>
                                <div class="seller-product-divider"></div>
                                <div class="seller-product-meta"><span>Price - <strong>${price} Ks</strong></span><span>Stock - <strong>${stock}</strong></span><span>Sale - <strong>${escapeSellerProductText((p.sale_type || 'prepaid').toUpperCase())}</strong></span></div>
                                <span class="seller-product-status ${p.is_active ? '' : 'is-inactive'}">${status}</span>
                                <div class="seller-product-actions" aria-label="Product actions">
                                    <button type="button" onclick="editProduct(${Number(p.book_id)})">Edit</button>
                                    <button type="button" onclick="deleteProduct(${Number(p.book_id)})">Delete</button>
                                </div>
                            </div>
                        </article>
                    `;
                }).join('') || `<p class="empty-text">${q ? 'ရှာဖွေမှုနှင့်ကိုက်ညီသော ပစ္စည်းမတွေ့ပါ' : 'No products added yet'}</p>`}
            </div>
        `;
    }

    function editProduct(bookId) {
        const product = sellerProductsCache.find(item => Number(item.book_id) === Number(bookId));
        if (!product) return alert('Product details are unavailable. Please refresh the list.');
        document.querySelectorAll('.store-tab').forEach(t => t.classList.remove('active'));
        const selectedPrice = product.discounted_price ?? product.original_price ?? 0;

        document.getElementById('product-section').innerHTML = `
            <form class="compact-product-form" onsubmit="saveProductEdit(event, ${Number(bookId)})">
                <div class="sale-type-toggle-group">
                    <button type="button" class="${product.sale_type === 'prepaid' ? 'active' : ''}" onclick="setSaleType('prepaid', this)">Prepaid</button>
                    <button type="button" class="${product.sale_type === 'preorder' ? 'active' : ''}" onclick="setSaleType('preorder', this)">Preorder</button>
                    <button type="button" class="${product.sale_type === 'cod' ? 'active' : ''}" onclick="setSaleType('cod', this)">COD</button>
                    <input type="hidden" name="sale_type" id="product-sale-type" value="${product.sale_type || 'prepaid'}">
                </div>

                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>စာအုပ်အမည် *</label>
                        <input type="text" name="title" value="${escapeSellerProductText(product.title)}" required maxlength="200">
                    </div>
                    <div class="form-group">
                        <label>စာရေးသူ</label>
                        <input type="text" name="author_name" value="${escapeSellerProductText(product.author_name || '')}">
                    </div>
                    <div class="form-group">
                        <label>အမျိုးအစား</label>
                        <select name="category_id" id="edit-cat-select"><option value="${product.category_id}">Loading...</option></select>
                    </div>
                    <div class="form-group">
                        <label>မူရင်းဈေး (Ks) *</label>
                        <input type="number" name="original_price" value="${Number(product.original_price || 0)}" required>
                    </div>
                    <div class="form-group">
                        <label>လျော့ဈေး (Ks)</label>
                        <input type="number" name="discounted_price" value="${Number(selectedPrice)}">
                    </div>
                    <div class="form-group">
                        <label>အရေအတွက်</label>
                        <input type="number" name="stock_quantity" value="${Number(product.stock_quantity || 0)}">
                    </div>
                    <div class="form-group">
                        <label>ခန့်မှန်းပို့ဆောင်ချိန်</label>
                        <input type="text" name="estimated_delivery_time" value="${escapeSellerProductText(product.estimated_delivery_time || '')}">
                    </div>

                    <div class="form-group full-width preorder-only" style="display:none;">
                        <label>Preorder စတင်မည့်အချိန်</label>
                        <input type="datetime-local" name="preorder_start_at" value="${product.preorder_start_at ? String(product.preorder_start_at).slice(0, 16) : ''}">
                    </div>
                    <div class="form-group preorder-only" style="display:none;">
                        <label>Preorder ကုန်ဆုံးမည့်အချိန်</label>
                        <input type="datetime-local" name="preorder_end_at" value="${product.preorder_end_at ? String(product.preorder_end_at).slice(0, 16) : ''}">
                    </div>
                    <div class="form-group preorder-only" style="display:none;">
                        <label>ကြိုတင်ပေးချေရမည့်ဈေး (Ks)</label>
                        <input type="number" name="preorder_deposit_amount" value="${Number(product.preorder_deposit_amount || 0)}">
                    </div>
                    <div class="form-group cod-only full-width" style="display:none;">
                        <label>COD စရံငွေ (Ks)</label>
                        <input type="number" name="cod_deposit_amount" value="${Number(product.cod_deposit_amount || 0)}">
                    </div>

                    <div class="form-group full-width">
                        <label>အသေးစိတ် ဖော်ပြချက်</label>
                        <textarea name="description">${escapeSellerProductText(product.description || '')}</textarea>
                    </div>
                </div>

                <div class="compact-actions">
                    <button type="button" class="btn-secondary" onclick="showProductList()">Cancel</button>
                    <button type="submit" class="btn-primary">Save</button>
                </div>
            </form>`;

        fetch(`${API_URL}/products/categories/all`).then(res => res.json()).then(categories => {
            const select = document.getElementById('edit-cat-select');
            if (select) {
                select.innerHTML = `<option value="">Select category</option>${categories.map(c => `<option value="${Number(c.category_id)}" ${Number(c.category_id) === Number(product.category_id) ? 'selected' : ''}>${escapeSellerProductText(c.name)}</option>`).join('')}`;
            }
        }).catch(() => {});

        setSaleType(product.sale_type || 'prepaid', document.querySelector('.sale-type-toggle-group button.active'));
    }

    async function saveProductEdit(event, bookId) {
        event.preventDefault();
        const form = event.target;
        const body = Object.fromEntries(new FormData(form).entries());
        body.category_id = body.category_id || null;
        body.original_price = Number(body.original_price);
        body.discounted_price = body.discounted_price === '' ? body.original_price : Number(body.discounted_price);
        body.stock_quantity = Number(body.stock_quantity);
        const submit = form.querySelector('button[type="submit"]');
        submit.disabled = true;
        try {
            const res = await fetch(`${API_URL}/products/${bookId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${storeToken}` }, body: JSON.stringify(body) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Unable to save product');
            alert('Product updated successfully.');
            await showProductList();
        } catch (err) { submit.disabled = false; alert(err.message); }
    }

    async function deleteProduct(bookId) {
        const product = sellerProductsCache.find(item => Number(item.book_id) === Number(bookId));
        if (!product || !confirm(`"${product.title || 'ဒီပစ္စည်း'}" ကို အပြီးတိုင်ဖျက်မလား? ဖျက်ပြီးပါက ပြန်ယူ၍မရပါ။`)) return;
        try {
            const res = await fetch(`${API_URL}/products/${bookId}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${storeToken}` } });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Unable to delete product');
            alert('ပစ္စည်းကို အပြီးတိုင်ဖျက်ပြီးပါပြီ။');
            await showProductList();
        } catch (err) { alert(err.message); }
    }
</script>

<script>

                    <div class="form-group">

                        <input type="number" name="stock_quantity" value="0" min="0" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>ခန့်မှန်းပို့ဆောင်ချိန်</label>
                        <input type="text" name="estimated_delivery_time" placeholder="ဥပမာ 2-5 ရက်">
                    </div>

                    <div class="form-group full-width preorder-only" style="display:none;">
                        <label>Preorder စတင်မည့်အချိန်</label>
                        <input type="datetime-local" name="preorder_start_at">
                    </div>
                    <div class="form-group preorder-only" style="display:none;">
                        <label>Preorder ကုန်ဆုံးမည့်အချိန်</label>
                        <input type="datetime-local" name="preorder_end_at">
                    </div>
                    <div class="form-group preorder-only" style="display:none;">
                        <label>ကြိုတင်ပေးချေရမည့်ဈေး (Ks)</label>

                    </div>
                    <div class="form-group cod-only full-width" style="display:none;">
                        <label>COD စရံငွေ (Ks) မယူကထည့်စရာမလိုပါ။</label>

    function setSaleType(type, btn) {
        document.querySelectorAll('.sale-type-toggle-group button').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        const hiddenInput = document.getElementById('product-sale-type');
        if (hiddenInput) hiddenInput.value = type;
        document.querySelectorAll('.preorder-only').forEach(el => { el.style.display = type === 'preorder' ? 'flex' : 'none'; });
        document.querySelectorAll('.cod-only').forEach(el => { el.style.display = type === 'cod' ? 'flex' : 'none'; });
    }

    function addVariation() {
        variationDrafts.push({ name: '', price: '', stock: '', files: [] });
        renderCompactVariations();
    }

    function handleVariationImages(index, input) {
        // Append newly picked files to what's already chosen for this option
        // instead of replacing — the file dialog only returns the latest picks.
        const existing = variationDrafts[index].files || [];
        variationDrafts[index].files = [...existing, ...Array.from(input.files || [])].slice(0, 5);
        renderCompactVariations();
    }

    function renderCompactVariations() {
        const target = document.getElementById('variations-list');
        if (!target) return;
        target.innerHTML = variationDrafts.map((v, i) => {
            const files = v.files || [];
            const imagesHtml = files.map((file, fi) => `
                <div class="compact-image-preview">
                    <img src="${URL.createObjectURL(file)}" alt="${v.name || 'Option'} image">
                    <button type="button" onclick="variationDrafts[${i}].files.splice(${fi},1); renderCompactVariations()">×</button>
                </div>
            `).join('');
            const addBtn = files.length < 5 ? `
                <div class="compact-image-add" onclick="document.getElementById('variation-file-${i}').click()"><i class="fas fa-plus"></i></div>
                <input type="file" id="variation-file-${i}" accept="image/*" multiple style="display:none" onchange="handleVariationImages(${i}, this)">
            ` : '';
            return `
                <div class="compact-variation-card">
                    <div class="compact-variation-row">
                        <input type="text" placeholder="Option name" value="${v.name}" onchange="variationDrafts[${i}].name=this.value" required>
                        <input type="number" placeholder="Price" value="${v.price}" onchange="variationDrafts[${i}].price=this.value" required>
                        <input type="number" placeholder="Stock" value="${v.stock}" onchange="variationDrafts[${i}].stock=this.value" required>
                        <button type="button" onclick="variationDrafts.splice(${i},1); renderCompactVariations()">×</button>
                    </div>
                    <div class="compact-variation-images">
                        ${imagesHtml}
                        ${addBtn}
                        <span class="small text-secondary" style="font-size:10px;">${files.length}/5 ပုံ</span>
                    </div>
                </div>
            `;
        }).join('') || '<p class="small text-secondary" style="font-size:10px;">No options added</p>';
    }

    function handleImageSelect(input) {
        // Append newly picked files to what's already selected (the file dialog
        // always returns just the latest picks, so we merge instead of replacing).
        selectedImages = [...selectedImages, ...Array.from(input.files)].slice(0, 5);
        syncImageInputFiles();
        renderImagePreviews();
    }

    function syncImageInputFiles() {
        const input = document.getElementById('prod-images');
        const dt = new DataTransfer();
        selectedImages.forEach(f => dt.items.add(f));
        input.files = dt.files;
    }

    function renderImagePreviews() {
        const container = document.getElementById('image-preview-container');
        container.innerHTML = selectedImages.map((file, i) => `
            <div class="compact-image-preview">
                <img src="${URL.createObjectURL(file)}" alt="Preview">
                <button type="button" onclick="removeImage(${i})">×</button>
            </div>
        `).join('') + (selectedImages.length < 5
            ? `<div class="compact-image-add" onclick="document.getElementById('prod-images').click()"><i class="fas fa-plus"></i></div>`
            : '');
    }

    function removeImage(index) {
        selectedImages.splice(index, 1);
        syncImageInputFiles();
        renderImagePreviews();
    }

    async function submitProduct(e) {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);
        const files = document.getElementById('prod-images').files;

        for (let f of files) { formData.append('images', f); }

        const variationPayload = variationDrafts.map(v => ({
            name: v.name.trim(),
            price: Number(v.price),
            stock: Number(v.stock),
            image_count: (v.files || []).length
        }));
        if (variationPayload.some(v => !v.name || !Number.isFinite(v.price) || v.price < 0 || !Number.isInteger(v.stock) || v.stock < 0)) {
            return alert('Please complete every option name, price, and stock field.');
        }
        formData.set('variations', JSON.stringify(variationPayload));
        formData.set('variation_image_map', JSON.stringify(variationDrafts.map(v => (v.files || []).length)));
        variationDrafts.forEach(v => (v.files || []).forEach(file => formData.append('variation_images', file)));

        try {
            const res = await fetch(`${API_URL}/products`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${storeToken}` },
                body: formData
            });
            if (res.ok) {
                alert('Product added successfully!');
                selectedImages = [];
                showProductList();
            } else {
                const data = await res.json();
                alert('Error: ' + (data.error || 'Failed to add product'));
            }
        } catch (err) { alert('Error: ' + err.message); }
    }
</script>

<script>
    async function renderStoreChat(container) {
        container.innerHTML = `<div class="chat-page"><h2>Shop Messages <i class="fas fa-info-circle info-icon" onclick="toggleInfo('info-chat')"></i></h2><p id="info-chat" class="info-text">ဒီနေရာမှာ စာတိုတွေအကြောင်း ရေးထည့်နိုင်ပါတယ်။</p><div id="store-conversation-list" class="conversation-list"><p class="loading">Loading messages...</p></div></div>`;
        const res = await fetch(`${API_URL}/chat/conversations`, { headers: { 'Authorization': `Bearer ${storeToken}` } });
        const convs = await res.json();
        document.getElementById('store-conversation-list').innerHTML = convs.map(c => `<div class="conversation-item" onclick="openStoreChat(${c.conversation_id})"><div class="conv-avatar">${c.peer_profile?.image ? `<img src="${escapeSellerProductText(c.peer_profile.image)}" alt="">` : '<i class="fas fa-user"></i>'}</div><div class="conv-info"><h4>${escapeSellerProductText(c.peer_profile?.display_name || `Conversation #${c.conversation_id}`)}</h4><small>${c.peer_profile?.type === 'buyer' ? 'ဝယ်သူ' : 'ဆိုင်'}${c.peer_profile?.public_id ? ` · ${escapeSellerProductText(c.peer_profile.public_id)}` : ''}</small><p>${String(c.last_message || 'No messages yet').replace(/[&<>"']/g, '')}</p><span>${c.last_message_time ? new Date(c.last_message_time).toLocaleString() : ''}</span></div><button class="chat-delete-btn" aria-label="Delete chat" onclick="event.stopPropagation(); deleteStoreChat(${c.conversation_id})"><i class="fas fa-trash-alt"></i></button></div>`).join('') || '<p class="empty-text">No conversations yet</p>';
    }

    async function openStoreChat(conversationId) {
        const main = document.getElementById('store-content');
        main.innerHTML = `<div class="chat-page"><button class="btn-text" onclick="navigateStore('chat')"><i class="fas fa-arrow-left"></i> Back</button><h2 id="store-chat-peer-title">Conversation #${conversationId}</h2><div id="store-message-list" class="message-list">Loading...</div><form onsubmit="sendStoreChat(event, ${conversationId})" class="chat-compose"><input id="store-chat-input" required maxlength="2000" placeholder="Write a reply..."><button class="btn-primary">Send</button></form></div>`;
        const res = await fetch(`${API_URL}/chat/${conversationId}`, { headers: { 'Authorization': `Bearer ${storeToken}` } });
        const messages = await res.json();
        if (!res.ok) return document.getElementById('store-message-list').textContent = messages.error || 'Unable to load messages';
        const peer = messages.find(m => String(m.sender_id) !== `S${storeUser.seller_id}`)?.sender_name;
        if (peer) document.getElementById('store-chat-peer-title').textContent = peer;
        document.getElementById('store-message-list').innerHTML = messages.map(m => `<div class="message-bubble"><div>${String(m.content || '').replace(/[&<>"']/g, '')}</div><small>${String(m.sender_name || '')}</small></div>`).join('') || 'No messages yet';
    }

    async function sendStoreChat(event, conversationId) {
        event.preventDefault(); const input = document.getElementById('store-chat-input'); const content = input.value.trim(); if (!content) return;
        const res = await fetch(`${API_URL}/chat`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${storeToken}` }, body: JSON.stringify({ conversation_id: conversationId, content }) });
        const data = await res.json(); if (!res.ok) return alert(data.error || 'Unable to send message'); openStoreChat(conversationId);
    }

    async function deleteStoreChat(conversationId) {
        if (!confirm('ဒီ chat ကို သင့် chat list မှ ဖျက်မလား?')) return;
        const res = await fetch(`${API_URL}/chat/conversations/${conversationId}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${storeToken}` } });
        const data = await res.json();
        if (!res.ok) return alert(data.error || 'Unable to delete chat');
        renderStoreChat(document.getElementById('store-content'));
    }

    async function renderStoreSettings(container) {
        container.innerHTML = `
            <h2>Store Settings <i class="fas fa-info-circle info-icon" onclick="toggleInfo('info-settings')"></i></h2>
            <p id="info-settings" class="info-text">Telegram User iD သည် @userinfobot သို့သွားပြီး /startကိုနှိပ်၍ ID ရယူပြီးထည့်ပါ။ ထို့နောက် သင့်အကောင့်ကို Order တက်တိုင်းပို့နေပါမည်။</p>
            <p class="small text-secondary">Open one section at a time to keep the settings screen clear.</p>
            <details class="settings-accordion" open><summary>Store Availability</summary><section class="settings-section store-availability-card">
               <div class="settings-section-heading">
    <div>
        <span class="form-eyebrow">CUSTOMER-FACING</span>
        <h3>-စီမံမှု</h3>
        <p class="small text-secondary">-ဆိုင်ဖွင့်ချိန်ပိတ်ချိန်နှင့် စာပြန်ချိန်များစီမံပါ။ </p>

</div>
<div id="store-availability-form" class="availability-form">

</div>

                    <button onclick="updateTelegramId()" class="btn-primary" style="margin-top:8px;width:auto;padding:10px 20px;">Update Telegram ID</button>
                </div>
            </div></details>
            <details class="settings-accordion"><summary>Appearance</summary><div class="settings-section">
                <button onclick="toggleNightMode()" class="btn-secondary"><i class="fas fa-moon"></i> Night Mode</button>
            </div></details>
        `;
        document.querySelectorAll(".settings-accordion").forEach(item => item.addEventListener("toggle", () => { if (item.open) document.querySelectorAll(".settings-accordion").forEach(other => { if (other !== item) other.open = false; }); }));
        await Promise.all([loadStoreSettings(), loadShippingConfig()]);
    }

    async function loadStoreSettings() {
        try {
            const res = await fetch(`${API_URL}/store/settings`, { headers: { 'Authorization': `Bearer ${storeToken}` } });
            const settings = await res.json();
            if (!res.ok) throw new Error(settings.error || 'Unable to load store settings');
            document.getElementById('store-status-badge').textContent = settings.is_open && settings.accepting_orders ? 'OPEN' : 'CLOSED';
            document.getElementById('store-status-badge').className = `availability-badge ${settings.is_open && settings.accepting_orders ? 'is-open' : 'is-closed'}`;
            document.getElementById('store-availability-form').innerHTML = `
                <label class="availability-toggle"><input type="checkbox" id="store-is-open" ${settings.is_open ? 'checked' : ''}><span class="toggle-track"></span><span><strong>Store is open</strong><small>ဆိုင်ပိတ်ချိန်ဖွင့်ချိန်စီမံပါ။</small></span></label>

                <label class="form-group"><span>Auto-reply message</span><textarea id="auto-reply-message" maxlength="300" rows="2" placeholder="မကြာမီ ပြန်လည်ဖြေကြားပေးပါမယ်။">${settings.auto_reply_message || ''}</textarea></label>

    async function saveStoreSettings() {
        const payload = {
            is_open: document.getElementById('store-is-open').checked ? 1 : 0,
            accepting_orders: document.getElementById('store-accepting-orders').checked ? 1 : 0,
            reply_time_minutes: Number(document.getElementById('reply-time-minutes').value),
            reply_time_text: document.getElementById('reply-time-text').value.trim(),
            closed_message: document.getElementById('closed-message').value.trim(),
            auto_reply_message: document.getElementById('auto-reply-message').value.trim()
        };
        const res = await fetch(`${API_URL}/store/settings`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${storeToken}` }, body: JSON.stringify(payload) });
        const data = await res.json();
        if (!res.ok) return alert(data.error || 'Unable to save store settings');
        alert('Store availability saved');
        loadStoreSettings();
    }

        try {
            const res = await fetch(`${API_URL}/shipping`, { headers: { 'Authorization': `Bearer ${storeToken}` } });
            const rates = await res.json();
            const nationwide = rates.find(r => r.state === 'ALL' && r.city === 'ALL' && r.township === 'ALL') || rates[0];
            document.getElementById('shipping-config').innerHTML = `
                <div class="nationwide-shipping-card">
                    <div class="shipping-card-heading"><i class="fas fa-truck"></i><div><h4>မြန်မာပြည်တစ်ဝှမ်း ခန့်မှန်းပို့ဆောင်ခ</h4><p class="small text-secondary">မြို့နယ်အလိုက် ပို့ခမသတ်မှတ်တော့ပါ။ Buyer က ခန့်မှန်းငွေကိုသာ မြင်ပြီး ပစ္စည်းရောက်မှ ပေးချေပါမည်။</p></div></div>
                    <div class="form-group"><label for="ship-fee">ခန့်မှန်းပို့ဆောင်ခ (ကျပ်)</label><input type="number" id="ship-fee" value="${Number(nationwide?.prepay_shipping_fee || 5000)}" min="0" step="500" placeholder="ဥပမာ ၅၀၀၀"></div>
                    <label class="checkbox-label"><input type="checkbox" id="ship-no" ${Number(nationwide?.is_no_shipping) ? 'checked' : ''}> ပို့ဆောင်ခအခမဲ့</label>
                    <button onclick="saveShippingRate()" class="btn-primary"><i class="fas fa-save"></i> Nationwide ပို့ခ သိမ်းမည်</button>
                </div>
                <p class="small text-secondary shipping-rate-note"><i class="fas fa-info-circle"></i> Prepaid / Preorder / COD အားလုံးတွင် ပို့ခကို checkout အချိန်တွင် မဖြတ်ပါ။ ပစ္စည်းရောက်မှသာ ပေးချေရပါမည်။</p>
            `;
        } catch (err) { document.getElementById('shipping-config').innerHTML = `<p class="error-text">Error loading shipping rates: ${err.message}</p>`; }
    }

    async function saveShippingRate() {
        const body = { nationwide: true, is_no_shipping: document.getElementById('ship-no').checked ? 1 : 0, prepay_shipping_fee: parseFloat(document.getElementById('ship-fee').value) || 5000 };
        try {
            const res = await fetch(`${API_URL}/shipping`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${storeToken}` }, body: JSON.stringify(body) });
            if (res.ok) { alert('Shipping rate saved successfully!'); await loadShippingConfig(); }
            else { const data = await res.json(); alert('Error: ' + (data.error || 'Failed to save shipping rate')); }
        } catch (err) { alert('Error: ' + err.message); }
    }

    async function updateTelegramId() {
        const telegramId = document.getElementById('telegram-id').value;
        if (!telegramId) { alert('Please enter a Telegram User ID'); return; }
        try {
            const res = await fetch(`${API_URL}/auth/me`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${storeToken}` }, body: JSON.stringify({ telegram_user_id: telegramId }) });
            if (res.ok) { alert('Telegram ID updated successfully!'); storeUser.telegram_user_id = telegramId; }
            else { const data = await res.json(); alert('Error: ' + (data.error || 'Failed to update Telegram ID')); }
        } catch (err) { alert('Error: ' + err.message); }
    }
</script>

<script>

    async function submitStoreWalletWithdrawal(event) {
        event.preventDefault();
        const amount = Number(document.getElementById('wallet-wd-amount').value);
        const payment_method = document.getElementById('wallet-wd-method').value;
        const account_name = document.getElementById('wallet-wd-name').value.trim();
        const account_phone = document.getElementById('wallet-wd-phone').value.trim();
        const error = document.getElementById('store-wallet-wd-error');
        if (!Number.isFinite(amount) || amount <= 0 || !account_name || !/^09\d{7,13}$/.test(account_phone.replace(/[\s-]/g, ''))) { error.textContent = 'Amount, account name and a valid 09 phone number are required'; return; }
        if (!confirm(`Step 1 of 2 — Withdraw ${amount.toLocaleString()} Ks to ${payment_method}?`)) return;
        if (!confirm('Step 2 of 2 — Submit this withdrawal request for Admin review?')) return;
        try {
            const res = await fetch(`${API_URL}/wallet/seller/withdraw`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${storeToken}` }, body: JSON.stringify({ amount, account_name, account_phone, payment_method }) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Withdrawal failed');
            alert('Withdrawal request submitted for Admin review.');
            navigateStore('wallet');
        } catch (err) { error.textContent = err.message; }
    }
