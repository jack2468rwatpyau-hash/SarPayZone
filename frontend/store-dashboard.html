<script>
    async function renderCodCommission(container) {
        container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading COD Commission...</div>';
        try {
            const [settleRes, accountRes] = await Promise.all([
                fetch(`${API_URL}/settlements/seller/cod`, { headers: { 'Authorization': `Bearer ${storeToken}` } }),
                fetch(`${API_URL}/settlements/seller/payment-accounts`, { headers: { 'Authorization': `Bearer ${storeToken}` } })
            ]);
            const data = await settleRes.json();
            const accounts = accountRes.ok ? await accountRes.json() : {};
            if (!settleRes.ok) throw new Error(data.error || 'Unable to load monthly COD commission');
            const due = Number(data.due || 0);
            const rows = (data.items || []).map(item => `<div class="cod-month-row"><span>${item.period_start} – ${item.period_end}<small>Due: ${item.due_date} · ${item.days_late || 0} day(s) late</small><small>Commission: ${Number(item.commission_amount || 0).toLocaleString()} Ks · Penalty: ${Number(item.late_fee || 0).toLocaleString()} Ks</small></span><strong>${Number(item.total_due || 0).toLocaleString()} Ks</strong></div>`).join('') || '<p class="small text-secondary">No Monthly COD Commission is due.</p>';
            const providers = ['kpay', 'wavepay', 'ayapay'].map(k => accounts[k]?.phone ? `<option value="${k}">${k.toUpperCase()} — ${escapeSellerProductText(accounts[k].name || '')} ${escapeSellerProductText(accounts[k].phone)}</option>` : '').join('');

            container.innerHTML = `
            <div class="store-header">
                <button class="btn-text" onclick="navigateStore('dashboard')"><i class="fas fa-arrow-left"></i> Back</button>
                <h2>COD Commission <i class="fas fa-info-circle info-icon" onclick="toggleInfo('info-cod')"></i></h2>
                <p>တစ်လအတွင်းဝယ်သူမှ မှာယူထားသောအိမ်ရောက်ငွေချေ (COD order)များမှ အောင်မြင်သော order များအတွက် တစ်လအတွင်း % ပေးသွင်းရန် </p>
            </div>
            <p id="info-cod" class="info-text">ဒီနေရာမှာ COD Commission အကြောင်း ရေးထည့်နိုင်ပါတယ်။</p>

            <section class="cod-commission-page">
                <div class="cod-total-card">
                    <span>လစဉ် COD Commission</span>
                    <strong>${due.toLocaleString()} Ks</strong>
                    <small>Late fee included: ${Number(data.late_fee || 0).toLocaleString()} Ks</small>
                </div>
                <div class="cod-month-list">${rows}</div>

                ${due > 0 ? `
                <form id="monthly-cod-payment-form" class="cod-payment-form">
                    <h3>ပေးသွင်းနည်း</h3>

                    <!-- Wallet Toggle Buttons -->
                    <div class="wallet-toggle-group">
                        <button type="button" class="active" onclick="setWalletType('mobile', this)">Mobile Wallet</button>
                        <button type="button" onclick="setWalletType('platform', this)">Platform Wallet</button>
                        <input type="hidden" name="wallet_type" id="wallet-payment-type" value="mobile">
                    </div>

                    <!-- Mobile Wallet Fields -->
                    <div id="mobile-wallet-fields">
                        <label>Wallet Provider<select id="monthly-cod-provider" required>${providers || '<option value="">Admin wallet info မရှိသေးပါ</option>'}</select></label>
                        <label>Transfer Reference<input id="monthly-cod-reference" maxlength="120" placeholder="Transaction reference" required></label>
                        <label>Note<textarea id="monthly-cod-note" rows="2"></textarea></label>
                    </div>

                    <!-- Platform Wallet Fields (Hidden by default) -->
                    <div id="platform-wallet-fields" style="display:none;">
                        <div class="info-text show" style="margin-bottom:10px;">
                            Platform Wallet မှ ပေးသွင်းပါက ချက်ချင်း ဖြတ်သွားပါမည်။
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">Review &amp; Pay ${due.toLocaleString()} Ks</button>
                    <p id="monthly-cod-error" class="error-text"></p>
                </form>` : '<div class="success-box">Monthly COD Commission ရှင်းလင်းပြီးပါပြီ။ Platform Wallet မှ ငွေထုတ်နိုင်ပါပြီ။</div>'}
            </section>`;

            document.getElementById('monthly-cod-payment-form')?.addEventListener('submit', submitMonthlyCodPayment);
        } catch (err) { container.innerHTML = `<p class="error-text">${escapeSellerProductText(err.message)}</p>`; }
    }

    function setWalletType(type, btn) {
        document.querySelectorAll('.wallet-toggle-group button').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        const hiddenInput = document.getElementById('wallet-payment-type');
        if (hiddenInput) hiddenInput.value = type;

        const mobileFields = document.getElementById('mobile-wallet-fields');
        const platformFields = document.getElementById('platform-wallet-fields');

        if (mobileFields && platformFields) {
            mobileFields.style.display = type === 'mobile' ? 'block' : 'none';
            platformFields.style.display = type === 'platform' ? 'block' : 'none';

            // Toggle required attributes
            mobileFields.querySelectorAll('input,select,textarea').forEach(el => { el.required = type === 'mobile'; });
        }
    }

    async function submitMonthlyCodPayment(event) {
        event.preventDefault();
        const method = document.getElementById('wallet-payment-type').value;
        const data = await (await fetch(`${API_URL}/settlements/seller/cod`, { headers: { 'Authorization': `Bearer ${storeToken}` } })).json();
        const amount = Number(data.due || 0);
        if (!amount) return alert('No Monthly COD Commission is due');

        if (!confirm(`Step 1 of 2 — Pay Monthly COD Commission ${amount.toLocaleString()} Ks using ${method === 'platform' ? 'Platform Wallet' : 'Mobile Wallet'}?`)) return;
        if (!confirm('Step 2 of 2 — Confirm this payment submission?')) return;

        const payload = { amount, payment_method: method === 'platform' ? 'platform_wallet' : 'external_wallet' };
        if (method === 'mobile') {
            payload.wallet_provider = document.getElementById('monthly-cod-provider').value;
            payload.reference = document.getElementById('monthly-cod-reference').value.trim();
            payload.note = document.getElementById('monthly-cod-note').value.trim();
        }

        const res = await fetch(`${API_URL}/settlements/seller/cod/submit`, { method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${storeToken}`}, body:JSON.stringify(payload) });
        const result = await res.json();
        if (!res.ok) return document.getElementById('monthly-cod-error').textContent = result.error || 'Payment failed';
        alert(method === 'platform' ? 'Monthly COD Commission paid from Platform Wallet.' : 'Payment submitted for Admin verification.');
        renderCodCommission(document.getElementById('store-content'));
    }

    function showStoreSubpage(page) {
        document.querySelectorAll('[data-store-subpage]').forEach(section => section.style.display = section.dataset.storeSubpage === page ? '' : 'none');
    }

    function payCommission() {
        // Keep the existing Store-page button, but route payment through the
        // dedicated monthly COD page instead of the retired wallet endpoint.
        navigateStore('cod-commission');
    }

    async function saveStoreProfile(event) {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData();
        ['store_name', 'name', 'email'].forEach(field => formData.append(field, form.elements[field].value.trim()));
        ['logo', 'banner'].forEach(field => { const file = form.elements[field].files?.[0]; if (file?.size) formData.append(field, file); });
        const res = await fetch(`${API_URL}/store/profile`, { method: 'PATCH', headers: { 'Authorization': `Bearer ${storeToken}` }, body: formData });
        const data = await res.json();
        if (!res.ok) return alert(data.error || 'Unable to save store profile');
        Object.assign(storeUser, { store_name: form.elements.store_name.value.trim(), name: form.elements.name.value.trim(), email: form.elements.email.value.trim(), logo: data.logo, banner: data.banner });
        alert('Store profile saved successfully');
    }

    async function startChat(userId, orderId) {
        const buyerId = Number(userId);
        if (!Number.isSafeInteger(buyerId) || buyerId <= 0) return alert('Buyer chat is unavailable for this order.');
        try {
            const res = await fetch(`${API_URL}/chat`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${storeToken}` }, body: JSON.stringify({ conversation_type: 'buyer_shop', participants: [`U${buyerId}`], related_order_id: Number(orderId) || null }) });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Unable to open chat');
            navigateStore('chat');
            openStoreChat(Number(data.conversation_id));
        } catch (err) { alert(err.message || 'Unable to open chat'); }
    }

    function toggleNightMode() {
        document.body.classList.toggle('night-mode');
        localStorage.setItem('spz_night', document.body.classList.contains('night-mode'));
    }

    function logout() {
        localStorage.removeItem('spz_store_token');
        window.location.href = '/publisherlogin.html';
    }

    // ===== INIT =====
    if (localStorage.getItem('spz_night') === 'true') { document.body.classList.add('night-mode'); }
    initStore();
</script>
</body>
</html>
